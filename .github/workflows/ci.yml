
name: Financial Data Pipeline CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests - Python 3.11 / Windows
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30

    env:
      PYTHON_VERSION: "3.11"
      PG_URL: postgresql://pipeline:pipeline@127.0.0.1:55432/pipeline_test
      TEST_DB_URL: postgresql://pipeline:pipeline@127.0.0.1:55432/pipeline_test
      DB_URL: postgresql://pipeline:pipeline@127.0.0.1:55432/pipeline_test
      S3_ENDPOINT: http://127.0.0.1:59000
      TEST_S3_ENDPOINT: http://127.0.0.1:59000
      S3_BUCKET: ci-warmup
      RETRY_MAX_ATTEMPTS: "10"
      RETRY_WAIT_SECONDS: "1"

    defaults:
      run:
        shell: powershell

    steps:

      # 1. Recuperation du code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Verification de Python
      - name: Vérifier Python
        run: |
          py -3.11 --version
          py -3.11 -m pip --version

      # 3. Installation des dependances
      - name: Installer les dépendances
        run: |
          py -3.11 -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          py -3.11 -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 4. Qualite du code
      - name: Analyse statique Ruff
        run: |
          py -3.11 -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 5. Demarrage PostgreSQL
      - name: Démarrer PostgreSQL
        run: |
          $existing = docker ps -aq --filter "name=^ci-postgres$"
          if ($existing) { docker rm -f ci-postgres }

          docker run -d `
            --name ci-postgres `
            -e POSTGRES_DB=pipeline_test `
            -e POSTGRES_USER=pipeline `
            -e POSTGRES_PASSWORD=pipeline `
            -p 127.0.0.1:55432:5432 `
            postgres:15-alpine

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $ready = $false

          for ($i = 0; $i -lt 30; $i++) {
            docker exec ci-postgres pg_isready -U pipeline -d pipeline_test

            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $ready) {
            docker logs --tail 50 ci-postgres
            throw "PostgreSQL n'est pas disponible."
          }

          Write-Host "PostgreSQL prêt."

      # 6. Demarrage SeaweedFS
      - name: Démarrer SeaweedFS S3
        run: |
          $existing = docker ps -aq --filter "name=^ci-s3$"
          if ($existing) { docker rm -f ci-s3 }

          docker run -d `
            --name ci-s3 `
            -p 127.0.0.1:59000:8333 `
            chrislusf/seaweedfs:latest `
            server -s3 -dir=/data

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "Attente de la disponibilité S3..."

          py -3.11 -c "from src.storage.s3_client import S3Manager; s = S3Manager(); s.wait_until_ready(); s.ensure_bucket_exists()"

          if ($LASTEXITCODE -ne 0) {
            docker logs --tail 50 ci-s3
            throw "SeaweedFS n'est pas disponible."
          }

          Write-Host "SeaweedFS prêt."

      # 7. Tests unitaires et integration
      - name: Exécuter les tests
        run: |
          py -3.11 -m pytest tests -v `
            --cov=src `
            --cov-report=term-missing `
            --cov-fail-under=80

          if ($LASTEXITCODE -ne 0) {
            throw "Les tests ont échoué."
          }

      # 8. Simulation des pannes et validation des retries
      - name: Tester la pipeline avec pannes simulées
        env:
          SIMULATE_DB_FAILURES: "2"
          SIMULATE_S3_FAILURES: "2"
          RETRY_WAIT_SECONDS: "0.5"
        run: |
          py -3.11 -c "from src.db.connection import reset_db; reset_db()"

          if ($LASTEXITCODE -ne 0) { throw "Réinitialisation DB échouée." }

          py -3.11 -m src.pipeline.main *> run1.log
          $exitCode = $LASTEXITCODE

          Get-Content run1.log

          if ($exitCode -ne 0) {
            throw "La pipeline avec pannes simulées a échoué."
          }

          $patterns = @(
            "3 trait.+\(s\), 0 ignor.+\(s\)",
            "panne temporaire 'db'",
            "panne temporaire 's3'"
          )

          foreach ($pattern in $patterns) {
            if (-not (Select-String -Path run1.log -Pattern $pattern -Quiet)) {
              throw "Résultat attendu absent des logs : $pattern"
            }
          }

          Write-Host "Retry DB et S3 validés."

      # 9. Verification de l'idempotence
      - name: Tester l'idempotence
        run: |
          py -3.11 -m src.pipeline.main *> run2.log
          $exitCode = $LASTEXITCODE

          Get-Content run2.log

          if ($exitCode -ne 0) {
            throw "La seconde exécution a échoué."
          }

          if (-not (Select-String -Path run2.log -Pattern "0 trait.+\(s\), 3 ignor.+\(s\)" -Quiet)) {
            throw "Idempotence non respectée : les fichiers ont été retraités."
          }

          Write-Host "Idempotence validée."

      # 10. Logs en cas d'echec
      - name: Récupérer les logs Docker
        if: failure()
        run: |
          docker logs --tail 50 ci-postgres 2>&1
          docker logs --tail 50 ci-s3 2>&1

      # 11. Nettoyage systematique
      - name: Nettoyer les conteneurs
        if: always()
        run: |
          foreach ($container in @("ci-s3", "ci-postgres")) {
            $id = docker ps -aq --filter "name=^$container$"
            if ($id) {
              docker rm -f $container
            }
          }

          Write-Host "Nettoyage terminé."
