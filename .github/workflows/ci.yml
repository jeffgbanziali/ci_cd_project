name: Financial Data Pipeline CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Les jobs Windows sont chaînés pour réutiliser l'installation Python
# sur l'unique runner self-hosted. Vérifier qu'un seul runner porte ces labels.
jobs:
  dependencies:
    name: "1 - Dependencies"
    runs-on: [self-hosted, Windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Python
        shell: powershell
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 11), 'Python 3.11 is required'"

      - name: Install project and development dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify required tools
        shell: powershell
        run: |
          python -c "import pytest, ruff, pandas, sqlalchemy, psycopg2, boto3"
          python -m pip check

  quality:
    name: "2 - Code quality"
    runs-on: [self-hosted, Windows]
    needs: dependencies
    steps:
      - uses: actions/checkout@v4
      - name: Ruff lint
        shell: powershell
        run: |
          ruff check .

  unit-tests:
    name: "3 - Unit tests"
    runs-on: [self-hosted, Windows]
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests (excluding dedicated SLM tests)
        shell: powershell
        run: |
          python -m pytest tests/unit -vv --ignore=tests/unit/test_slm_extractor.py

  slm-tests:
    name: "4 - SLM extraction tests"
    runs-on: [self-hosted, Windows]
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Run SLM extractor tests
        shell: powershell
        run: |
          python -m pytest tests/unit/test_slm_extractor.py -vv

  integration-tests:
    name: "5 - Integration tests"
    runs-on: [self-hosted, Windows]
    needs: slm-tests
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL
        shell: powershell
        run: |
          $name = "fpipe-ci-pg-integration"
          docker rm -f $name 2>$null
          docker run -d --name $name -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=financial_test -p 127.0.0.1::5432 postgres:16
          if ($LASTEXITCODE -ne 0) { throw "PostgreSQL container failed to start" }
          $port = (docker port $name 5432/tcp).Split(":")[-1]
          $env:PGPORT = $port
          $ready = $false
          for ($i=0; $i -lt 30; $i++) {
            docker exec $name pg_isready -U postgres -d financial_test *> $null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { docker logs $name; throw "PostgreSQL not ready" }
          "PG_URL=postgresql://postgres:postgres@127.0.0.1:$port/financial_test" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DB_URL=postgresql://postgres:postgres@127.0.0.1:$port/financial_test" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEST_DB_URL=postgresql://postgres:postgres@127.0.0.1:$port/financial_test" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Start SeaweedFS S3
        shell: powershell
        run: |
          $name = "fpipe-ci-s3-integration"
          docker rm -f $name 2>$null
          docker run -d --name $name -p 127.0.0.1::8333 chrislusf/seaweedfs:latest server -s3
          if ($LASTEXITCODE -ne 0) { throw "SeaweedFS container failed to start" }
          $port = (docker port $name 8333/tcp).Split(":")[-1]
          $ready = $false
          for ($i=0; $i -lt 40; $i++) {
            try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port" -TimeoutSec 2 -UseBasicParsing; $ready = $true; break } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ready) { docker logs $name; throw "SeaweedFS not ready" }
          "S3_ENDPOINT=http://127.0.0.1:$port" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEST_S3_ENDPOINT=http://127.0.0.1:$port" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "S3_BUCKET=financial-test" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run integration tests
        shell: powershell
        run: |
          python -m pytest tests/integration -vv

      - name: Diagnostics and cleanup
        if: always()
        shell: powershell
        run: |
          docker logs fpipe-ci-pg-integration 2>$null
          docker logs fpipe-ci-s3-integration 2>$null
          docker rm -f fpipe-ci-pg-integration fpipe-ci-s3-integration 2>$null

  resilience-tests:
    name: "6 - Retry and resilience tests"
    runs-on: [self-hosted, Windows]
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL and SeaweedFS
        shell: powershell
        run: |
          $pg = "fpipe-ci-pg-resilience"
          $s3 = "fpipe-ci-s3-resilience"
          docker rm -f $pg $s3 2>$null
          docker run -d --name $pg -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=financial_test -p 127.0.0.1::5432 postgres:16
          if ($LASTEXITCODE -ne 0) { throw "PostgreSQL start failed" }
          $pgPort = (docker port $pg 5432/tcp).Split(":")[-1]
          $ready = $false
          for ($i=0; $i -lt 30; $i++) { docker exec $pg pg_isready -U postgres -d financial_test *> $null; if ($LASTEXITCODE -eq 0) { $ready=$true; break }; Start-Sleep 2 }
          if (-not $ready) { throw "PostgreSQL not ready" }
          docker run -d --name $s3 -p 127.0.0.1::8333 chrislusf/seaweedfs:latest server -s3
          if ($LASTEXITCODE -ne 0) { throw "SeaweedFS start failed" }
          $s3Port = (docker port $s3 8333/tcp).Split(":")[-1]
          $ready = $false
          for ($i=0; $i -lt 40; $i++) { try { Invoke-WebRequest "http://127.0.0.1:$s3Port" -TimeoutSec 2 -UseBasicParsing | Out-Null; $ready=$true; break } catch { Start-Sleep 2 } }
          if (-not $ready) { throw "SeaweedFS not ready" }
          "PG_URL=postgresql://postgres:postgres@127.0.0.1:$pgPort/financial_test" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DB_URL=postgresql://postgres:postgres@127.0.0.1:$pgPort/financial_test" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TEST_DB_URL=postgresql://postgres:postgres@127.0.0.1:$pgPort/financial_test" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "S3_ENDPOINT=http://127.0.0.1:$s3Port" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TEST_S3_ENDPOINT=http://127.0.0.1:$s3Port" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "S3_BUCKET=financial-test" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run retry and resilience tests
        shell: powershell
        run: |
          python -m pytest tests/integration -vv -k "retry or unreachable"

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          docker rm -f fpipe-ci-pg-resilience fpipe-ci-s3-resilience 2>$null

  pipeline-e2e:
    name: "7 - End-to-end pipeline"
    runs-on: [self-hosted, Windows]
    needs: resilience-tests
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL and SeaweedFS
        shell: powershell
        run: |
          $pg = "fpipe-ci-pg-e2e"
          $s3 = "fpipe-ci-s3-e2e"
          docker rm -f $pg $s3 2>$null
          docker run -d --name $pg -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=financial_test -p 127.0.0.1::5432 postgres:16
          if ($LASTEXITCODE -ne 0) { throw "PostgreSQL start failed" }
          $pgPort = (docker port $pg 5432/tcp).Split(":")[-1]
          $ready = $false
          for ($i=0; $i -lt 30; $i++) { docker exec $pg pg_isready -U postgres -d financial_test *> $null; if ($LASTEXITCODE -eq 0) { $ready=$true; break }; Start-Sleep 2 }
          if (-not $ready) { throw "PostgreSQL not ready" }
          docker run -d --name $s3 -p 127.0.0.1::8333 chrislusf/seaweedfs:latest server -s3
          if ($LASTEXITCODE -ne 0) { throw "SeaweedFS start failed" }
          $s3Port = (docker port $s3 8333/tcp).Split(":")[-1]
          $ready = $false
          for ($i=0; $i -lt 40; $i++) { try { Invoke-WebRequest "http://127.0.0.1:$s3Port" -TimeoutSec 2 -UseBasicParsing | Out-Null; $ready=$true; break } catch { Start-Sleep 2 } }
          if (-not $ready) { throw "SeaweedFS not ready" }
          "PG_URL=postgresql://postgres:postgres@127.0.0.1:$pgPort/financial_test" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DB_URL=postgresql://postgres:postgres@127.0.0.1:$pgPort/financial_test" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TEST_DB_URL=postgresql://postgres:postgres@127.0.0.1:$pgPort/financial_test" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "S3_ENDPOINT=http://127.0.0.1:$s3Port" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TEST_S3_ENDPOINT=http://127.0.0.1:$s3Port" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "S3_BUCKET=financial-test" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Reset database
        shell: powershell
        run: |
          python -c "from src.db.connection import reset_db; reset_db()"

      - name: Run pipeline and verify first ingestion
        shell: powershell
        run: |
          $log = "pipeline-e2e-first.log"
          python -m src.main 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "First pipeline execution failed" }
          @'
          from pathlib import Path
          import re
          text = Path("pipeline-e2e-first.log").read_text(encoding="utf-8", errors="replace")
          matches = re.findall(r"(\d+)\s+trait[eé]?\(s\),\s*(\d+)\s+ignor[eé]?\(s\),\s*(\d+)\s+invalide\(s\)", text, re.I)
          if not matches:
              raise SystemExit("Pipeline summary not found in log")
          if tuple(map(int, matches[-1])) != (3, 0, 0):
              raise SystemExit(f"Unexpected first-run summary: {matches[-1]}")
          print("First ingestion verified: 3 processed, 0 ignored, 0 invalid")
          '@ | python -

      - name: Run pipeline again and verify idempotence
        shell: powershell
        run: |
          $log = "pipeline-e2e-second.log"
          python -m src.main 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "Second pipeline execution failed" }
          @'
          from pathlib import Path
          import re
          text = Path("pipeline-e2e-second.log").read_text(encoding="utf-8", errors="replace")
          matches = re.findall(r"(\d+)\s+trait[eé]?\(s\),\s*(\d+)\s+ignor[eé]?\(s\),\s*(\d+)\s+invalide\(s\)", text, re.I)
          if not matches:
              raise SystemExit("Pipeline summary not found in log")
          if tuple(map(int, matches[-1])) != (0, 3, 0):
              raise SystemExit(f"Unexpected second-run summary: {matches[-1]}")
          print("Idempotence verified: 0 processed, 3 ignored, 0 invalid")
          '@ | python -

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          docker rm -f fpipe-ci-pg-e2e fpipe-ci-s3-e2e 2>$null

  docker-build:
    name: "8 - Docker image build"
    runs-on: ubuntu-latest
    needs: pipeline-e2e
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: financial-data-pipeline:ci
