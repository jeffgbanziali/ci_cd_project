
name: Financial Data Pipeline CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests - Python 3.11 / Windows
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30

    env:
      PG_URL: postgresql://pipeline:pipeline@127.0.0.1:55432/pipeline_test
      TEST_DB_URL: postgresql://pipeline:pipeline@127.0.0.1:55432/pipeline_test
      DB_URL: postgresql://pipeline:pipeline@127.0.0.1:55432/pipeline_test
      S3_ENDPOINT: http://127.0.0.1:59000
      TEST_S3_ENDPOINT: http://127.0.0.1:59000
      S3_BUCKET: ci-warmup
      RETRY_MAX_ATTEMPTS: "10"
      RETRY_WAIT_SECONDS: "1"

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier Python
        run: |
          py -3.11 --version
          if ($LASTEXITCODE -ne 0) {
            throw "Python 3.11 est introuvable."
          }

          py -3.11 -m pip --version
          if ($LASTEXITCODE -ne 0) {
            throw "Pip est indisponible."
          }

      - name: Installer les dépendances
        run: |
          py -3.11 -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {
            throw "Mise à jour de pip impossible."
          }

          py -3.11 -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Installation des dépendances impossible."
          }

      - name: Analyse statique Ruff
        run: |
          py -3.11 -m ruff check .
          if ($LASTEXITCODE -ne 0) {
            throw "Ruff a détecté des erreurs."
          }

      - name: Démarrer PostgreSQL
        run: |
          $existing = docker ps -aq --filter "name=^ci-postgres$"

          if ($existing) {
            docker rm -f ci-postgres
          }

          docker run -d `
            --name ci-postgres `
            -e POSTGRES_DB=pipeline_test `
            -e POSTGRES_USER=pipeline `
            -e POSTGRES_PASSWORD=pipeline `
            -p 127.0.0.1:55432:5432 `
            postgres:15-alpine

          if ($LASTEXITCODE -ne 0) {
            throw "Impossible de démarrer PostgreSQL."
          }

          $ready = $false

          for ($i = 0; $i -lt 30; $i++) {
            docker exec ci-postgres pg_isready -U pipeline -d pipeline_test

            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $ready) {
            cmd.exe /d /c "docker logs --tail 50 ci-postgres > postgres-startup.log 2>&1"
            Get-Content postgres-startup.log
            throw "PostgreSQL n'est pas disponible."
          }

          Write-Host "PostgreSQL prêt."

      - name: Démarrer SeaweedFS S3
        run: |
          $existing = docker ps -aq --filter "name=^ci-s3$"

          if ($existing) {
            docker rm -f ci-s3
          }

          docker run -d `
            --name ci-s3 `
            -p 127.0.0.1:59000:8333 `
            chrislusf/seaweedfs:latest `
            server -s3 -dir=/data

          if ($LASTEXITCODE -ne 0) {
            throw "Impossible de démarrer SeaweedFS."
          }

          Write-Host "Attente de la disponibilité S3..."

          $ready = $false

          for ($i = 0; $i -lt 30; $i++) {
            cmd.exe /d /c "py -3.11 -c `"from src.storage.s3_client import S3Manager; s = S3Manager(); s.wait_until_ready(); s.ensure_bucket_exists()`" > s3-startup.log 2>&1"

            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $ready) {
            Get-Content s3-startup.log
            cmd.exe /d /c "docker logs --tail 50 ci-s3 > s3-container.log 2>&1"
            Get-Content s3-container.log
            throw "SeaweedFS n'est pas disponible."
          }

          Write-Host "SeaweedFS prêt."

      - name: Exécuter les tests
        run: |
          py -3.11 -m pytest tests -v --cov=src --cov-report=term-missing --cov-fail-under=80

          if ($LASTEXITCODE -ne 0) {
            throw "Les tests ont échoué."
          }

      - name: Réinitialiser la base avant la simulation
        run: |
          cmd.exe /d /c "py -3.11 -c `"from src.db.connection import reset_db; reset_db()`" > reset-db.log 2>&1"

          $exitCode = $LASTEXITCODE
          Get-Content reset-db.log

          if ($exitCode -ne 0) {
            throw "Réinitialisation de la base impossible."
          }

      - name: Tester la pipeline avec pannes simulées
        env:
          DB_URL: postgresql://pipeline:pipeline@127.0.0.1:55432/pipeline_test
          S3_ENDPOINT: http://127.0.0.1:59000
          SIMULATE_DB_FAILURES: "2"
          SIMULATE_S3_FAILURES: "2"
          RETRY_WAIT_SECONDS: "0.5"

        run: |
          cmd.exe /d /c "py -3.11 -m src.pipeline.main > run1.log 2>&1"

          $exitCode = $LASTEXITCODE
          Get-Content run1.log

          if ($exitCode -ne 0) {
            throw "La pipeline a échoué. Code : $exitCode"
          }

          $patterns = @(
            "3 trait.+\(s\), 0 ignor.+\(s\)",
            "panne temporaire 'db'",
            "panne temporaire 's3'"
          )

          foreach ($pattern in $patterns) {
            if (-not (Select-String -Path run1.log -Pattern $pattern -Quiet)) {
              throw "Résultat attendu absent : $pattern"
            }
          }

          Write-Host "Simulation des pannes validée."

      - name: Tester l'idempotence
        env:
          DB_URL: postgresql://pipeline:pipeline@127.0.0.1:55432/pipeline_test
          S3_ENDPOINT: http://127.0.0.1:59000

        run: |
          cmd.exe /d /c "py -3.11 -m src.pipeline.main > run2.log 2>&1"

          $exitCode = $LASTEXITCODE
          Get-Content run2.log

          if ($exitCode -ne 0) {
            throw "La seconde exécution a échoué. Code : $exitCode"
          }

          if (-not (Select-String -Path run2.log -Pattern "0 trait.+\(s\), 3 ignor.+\(s\)" -Quiet)) {
            throw "Idempotence non respectée."
          }

          Write-Host "Idempotence validée."

      - name: Récupérer les logs Docker
        if: failure()
        run: |
          cmd.exe /d /c "docker logs --tail 100 ci-postgres > postgres-error.log 2>&1"
          Get-Content postgres-error.log

          cmd.exe /d /c "docker logs --tail 100 ci-s3 > s3-error.log 2>&1"
          Get-Content s3-error.log

          if (Test-Path run1.log) {
            Get-Content run1.log
          }

          if (Test-Path run2.log) {
            Get-Content run2.log
          }

      - name: Nettoyer les conteneurs
        if: always()
        run: |
          foreach ($container in @("ci-s3", "ci-postgres")) {
            $id = docker ps -aq --filter "name=^$container$"

            if ($id) {
              docker rm -f $container
            }
          }

          Write-Host "Nettoyage terminé."
