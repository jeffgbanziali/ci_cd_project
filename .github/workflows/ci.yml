name: Financial Data Pipeline CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =====================================================
  # JOB 1 - CODE QUALITY
  # =====================================================
  quality:
    name: "1 - Code Quality"
    runs-on: [self-hosted, Windows]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier Python 3.11
        shell: powershell
        run: |
          py -3.11 --version
          if ($LASTEXITCODE -ne 0) {
            throw "Python 3.11 introuvable."
          }

      - name: Installer les dépendances
        shell: powershell
        run: |
          py -3.11 -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {
            throw "Mise à jour pip impossible."
          }

          py -3.11 -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Installation des dépendances impossible."
          }

      - name: Analyse statique Ruff
        shell: powershell
        run: |
          py -3.11 -m ruff check .
          if ($LASTEXITCODE -ne 0) {
            throw "Ruff a détecté des erreurs."
          }

  # =====================================================
  # JOB 2 - UNIT TESTS
  # =====================================================
  unit-tests:
    name: "2 - Unit Tests"
    runs-on: [self-hosted, Windows]
    needs: quality
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les dépendances
        shell: powershell
        run: |
          py -3.11 -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Installation impossible."
          }

      - name: Tester les fonctions unitaires
        shell: powershell
        run: |
          cmd.exe /d /c "py -3.11 -m pytest tests/unit -v > unit-tests.log 2>&1"
          $exitCode = $LASTEXITCODE

          if (Test-Path unit-tests.log) {
            Get-Content unit-tests.log
          }

          if ($exitCode -ne 0) {
            throw "Les tests unitaires ont échoué."
          }

  # =====================================================
  # JOB 3 - INTEGRATION TESTS
  # =====================================================
  integration-tests:
    name: "3 - Integration Tests"
    runs-on: [self-hosted, Windows]
    needs: unit-tests
    timeout-minutes: 40

    env:
      CI_POSTGRES_NAME: ci-postgres-integration-${{ github.run_id }}-${{ github.run_attempt }}
      CI_S3_NAME: ci-s3-integration-${{ github.run_id }}-${{ github.run_attempt }}

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les dépendances
        run: |
          py -3.11 -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Installation impossible."
          }

      - name: Démarrer PostgreSQL
        run: |
          docker run -d `
            --name $env:CI_POSTGRES_NAME `
            -e POSTGRES_DB=pipeline_test `
            -e POSTGRES_USER=pipeline `
            -e POSTGRES_PASSWORD=pipeline `
            -p 127.0.0.1::5432 `
            postgres:15-alpine

          if ($LASTEXITCODE -ne 0) {
            throw "Démarrage PostgreSQL impossible."
          }

          $pgPort = $null
          $pgReady = $false

          for ($i = 0; $i -lt 30; $i++) {
            $mapping = docker port $env:CI_POSTGRES_NAME 5432/tcp

            if ($mapping) {
              $pgPort = ($mapping.Trim() -split ":")[-1]
            }

            if ($pgPort) {
              docker exec $env:CI_POSTGRES_NAME pg_isready -U pipeline -d pipeline_test

              if ($LASTEXITCODE -eq 0) {
                $pgReady = $true
                break
              }
            }

            Start-Sleep -Seconds 2
          }

          if (-not $pgReady) {
            docker logs $env:CI_POSTGRES_NAME
            throw "PostgreSQL ne répond pas après 60 secondes."
          }

          $pgUrl = "postgresql://pipeline:pipeline@127.0.0.1:$pgPort/pipeline_test"
          $utf8 = New-Object System.Text.UTF8Encoding $false

          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "TEST_DB_URL=$pgUrl`n",
            $utf8
          )

          Write-Host "PostgreSQL prêt sur le port $pgPort."

      - name: Démarrer et vérifier SeaweedFS S3
        run: |
          docker run -d `
            --name $env:CI_S3_NAME `
            -p 127.0.0.1::8333 `
            chrislusf/seaweedfs:latest `
            server -s3 -dir=/data

          if ($LASTEXITCODE -ne 0) {
            throw "Démarrage SeaweedFS impossible."
          }

          $s3Port = $null
          $s3PortReady = $false

          # Attendre l'ouverture du port TCP S3 (maximum 60 secondes).
          for ($i = 0; $i -lt 30; $i++) {
            $mapping = docker port $env:CI_S3_NAME 8333/tcp

            if ($mapping) {
              $s3Port = ($mapping.Trim() -split ":")[-1]
            }

            if ($s3Port) {
              $tcp = New-Object System.Net.Sockets.TcpClient

              try {
                $connect = $tcp.BeginConnect("127.0.0.1", [int]$s3Port, $null, $null)
                $connected = $connect.AsyncWaitHandle.WaitOne(1000, $false)

                if ($connected -and $tcp.Connected) {
                  $tcp.EndConnect($connect)
                  $s3PortReady = $true
                  break
                }
              }
              catch {
                # Le port n'est pas encore prêt : nouvelle tentative.
              }
              finally {
                $tcp.Close()
              }
            }

            Start-Sleep -Seconds 2
          }

          if (-not $s3PortReady) {
            docker logs --tail 150 $env:CI_S3_NAME
            throw "Le port S3 de SeaweedFS n'est pas accessible après 60 secondes."
          }

          $endpoint = "http://127.0.0.1:$s3Port"

          # IMPORTANT : S3Manager utilise S3_ENDPOINT.
          # TEST_S3_ENDPOINT est également fourni pour les fixtures de tests.
          $env:S3_ENDPOINT = $endpoint
          $env:TEST_S3_ENDPOINT = $endpoint
          $env:S3_BUCKET = "transactions-test"

          Write-Host "Port S3 accessible : $endpoint"
          Write-Host "Vérification du client S3 et création du bucket..."

          # Appeler le client une seule fois après ouverture du port.
          # wait_until_ready() applique les retries configurés dans le code Python.
          cmd.exe /d /c "py -3.11 -c `"from src.storage.s3_client import S3Manager; s = S3Manager(); s.wait_until_ready(); s.ensure_bucket_exists()`" > s3-startup.log 2>&1"
          $s3ExitCode = $LASTEXITCODE

          if (Test-Path s3-startup.log) {
            Get-Content s3-startup.log
          }

          if ($s3ExitCode -ne 0) {
            docker logs --tail 150 $env:CI_S3_NAME
            throw "Le port S3 répond, mais S3Manager ne parvient pas à initialiser le bucket."
          }

          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "S3_ENDPOINT=$endpoint`nTEST_S3_ENDPOINT=$endpoint`nS3_BUCKET=transactions-test`n",
            $utf8
          )

          Write-Host "SeaweedFS S3 est opérationnel sur $endpoint."

      - name: Exécuter les tests d'intégration et vérifier la couverture
        run: |
          cmd.exe /d /c "py -3.11 -m pytest tests -v --cov=src --cov-report=term-missing --cov-fail-under=80 > integration-tests.log 2>&1"
          $exitCode = $LASTEXITCODE

          if (Test-Path integration-tests.log) {
            Get-Content integration-tests.log
          }

          if ($exitCode -ne 0) {
            throw "Les tests d'intégration ou le seuil de couverture ont échoué."
          }

      - name: Logs en cas d'échec
        if: failure()
        run: |
          docker ps -a

          foreach ($container in @($env:CI_POSTGRES_NAME, $env:CI_S3_NAME)) {
            $id = docker ps -aq --filter "name=^$container$"

            if ($id) {
              Write-Host "===== Logs : $container ====="
              docker logs --tail 150 $container
            }
          }

          foreach ($file in @("s3-startup.log", "integration-tests.log")) {
            if (Test-Path $file) {
              Write-Host "===== Fichier : $file ====="
              Get-Content $file
            }
          }

      - name: Nettoyer les conteneurs
        if: always()
        run: |
          foreach ($container in @($env:CI_POSTGRES_NAME, $env:CI_S3_NAME)) {
            $id = docker ps -aq --filter "name=^$container$"

            if ($id) {
              docker rm -f $container
            }
          }

  # =====================================================
  # JOB 4 - RESILIENCE & IDEMPOTENCE
  # =====================================================
  resilience-tests:
    name: "4 - Resilience & Idempotence Tests"
    runs-on: [self-hosted, Windows]
    needs: integration-tests
    timeout-minutes: 40

    env:
      CI_POSTGRES_NAME: ci-postgres-resilience-${{ github.run_id }}-${{ github.run_attempt }}
      CI_S3_NAME: ci-s3-resilience-${{ github.run_id }}-${{ github.run_attempt }}

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les dépendances
        run: |
          py -3.11 -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Installation impossible."
          }

      - name: Démarrer PostgreSQL
        run: |
          docker run -d `
            --name $env:CI_POSTGRES_NAME `
            -e POSTGRES_DB=pipeline_test `
            -e POSTGRES_USER=pipeline `
            -e POSTGRES_PASSWORD=pipeline `
            -p 127.0.0.1::5432 `
            postgres:15-alpine

          if ($LASTEXITCODE -ne 0) {
            throw "Démarrage PostgreSQL impossible."
          }

          $pgPort = $null
          $pgReady = $false

          for ($i = 0; $i -lt 30; $i++) {
            $mapping = docker port $env:CI_POSTGRES_NAME 5432/tcp

            if ($mapping) {
              $pgPort = ($mapping.Trim() -split ":")[-1]
            }

            if ($pgPort) {
              docker exec $env:CI_POSTGRES_NAME pg_isready -U pipeline -d pipeline_test

              if ($LASTEXITCODE -eq 0) {
                $pgReady = $true
                break
              }
            }

            Start-Sleep -Seconds 2
          }

          if (-not $pgReady) {
            docker logs $env:CI_POSTGRES_NAME
            throw "PostgreSQL ne répond pas après 60 secondes."
          }

          $pgUrl = "postgresql://pipeline:pipeline@127.0.0.1:$pgPort/pipeline_test"
          $utf8 = New-Object System.Text.UTF8Encoding $false

          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "DB_URL=$pgUrl`n",
            $utf8
          )

          Write-Host "PostgreSQL prêt sur le port $pgPort."

      - name: Démarrer et vérifier SeaweedFS S3
        run: |
          docker run -d `
            --name $env:CI_S3_NAME `
            -p 127.0.0.1::8333 `
            chrislusf/seaweedfs:latest `
            server -s3 -dir=/data

          if ($LASTEXITCODE -ne 0) {
            throw "Démarrage SeaweedFS impossible."
          }

          $s3Port = $null
          $s3PortReady = $false

          for ($i = 0; $i -lt 30; $i++) {
            $mapping = docker port $env:CI_S3_NAME 8333/tcp

            if ($mapping) {
              $s3Port = ($mapping.Trim() -split ":")[-1]
            }

            if ($s3Port) {
              $tcp = New-Object System.Net.Sockets.TcpClient

              try {
                $connect = $tcp.BeginConnect("127.0.0.1", [int]$s3Port, $null, $null)
                $connected = $connect.AsyncWaitHandle.WaitOne(1000, $false)

                if ($connected -and $tcp.Connected) {
                  $tcp.EndConnect($connect)
                  $s3PortReady = $true
                  break
                }
              }
              catch {
                # Le port n'est pas encore prêt : nouvelle tentative.
              }
              finally {
                $tcp.Close()
              }
            }

            Start-Sleep -Seconds 2
          }

          if (-not $s3PortReady) {
            docker logs --tail 150 $env:CI_S3_NAME
            throw "Le port S3 de SeaweedFS n'est pas accessible après 60 secondes."
          }

          $endpoint = "http://127.0.0.1:$s3Port"
          $env:S3_ENDPOINT = $endpoint
          $env:TEST_S3_ENDPOINT = $endpoint
          $env:S3_BUCKET = "transactions-test"

          Write-Host "Port S3 accessible : $endpoint"

          cmd.exe /d /c "py -3.11 -c `"from src.storage.s3_client import S3Manager; s = S3Manager(); s.wait_until_ready(); s.ensure_bucket_exists()`" > s3-startup.log 2>&1"
          $s3ExitCode = $LASTEXITCODE

          if (Test-Path s3-startup.log) {
            Get-Content s3-startup.log
          }

          if ($s3ExitCode -ne 0) {
            docker logs --tail 150 $env:CI_S3_NAME
            throw "S3Manager n'a pas pu initialiser le bucket."
          }

          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "S3_ENDPOINT=$endpoint`nTEST_S3_ENDPOINT=$endpoint`nS3_BUCKET=transactions-test`n",
            $utf8
          )

          Write-Host "SeaweedFS S3 est opérationnel sur $endpoint."

      - name: Vérifier les connexions
        run: |
          Write-Host "PostgreSQL et SeaweedFS ont passé leurs contrôles de disponibilité."
          Write-Host "S3_ENDPOINT=$env:S3_ENDPOINT"
          Write-Host "S3_BUCKET=$env:S3_BUCKET"

      - name: Tester la résilience aux pannes
        env:
          SIMULATE_DB_FAILURES: "2"
          SIMULATE_S3_FAILURES: "2"
          RETRY_MAX_ATTEMPTS: "3"
          RETRY_WAIT_SECONDS: "0.5"
        run: |
          cmd.exe /d /c "py -3.11 -m src.pipeline.main > run1.log 2>&1"
          $exitCode = $LASTEXITCODE

          Write-Host "=== EXECUTION AVEC PANNES SIMULEES ==="
          if (Test-Path run1.log) {
            Get-Content run1.log
          }

          if ($exitCode -ne 0) {
            throw "La pipeline a échoué avec le code $exitCode."
          }

          $patterns = @(
            "3 traité\(s\), 0 ignoré\(s\)",
            "panne temporaire 'db'",
            "panne temporaire 's3'"
          )

          foreach ($pattern in $patterns) {
            if (-not (Select-String -Path run1.log -Pattern $pattern -Quiet)) {
              throw "Résultat attendu absent : $pattern"
            }
          }

          Write-Host "Résilience validée."

      - name: Tester l'idempotence
        env:
          RETRY_MAX_ATTEMPTS: "3"
          RETRY_WAIT_SECONDS: "0.5"
        run: |
          cmd.exe /d /c "py -3.11 -m src.pipeline.main > run2.log 2>&1"
          $exitCode = $LASTEXITCODE

          Write-Host "=== SECONDE EXECUTION ==="
          if (Test-Path run2.log) {
            Get-Content run2.log
          }

          if ($exitCode -ne 0) {
            throw "La seconde exécution a échoué."
          }

          if (-not (Select-String -Path run2.log -Pattern "0 traité\(s\), 3 ignoré\(s\)" -Quiet)) {
            throw "L'idempotence n'est pas respectée."
          }

          Write-Host "Idempotence validée."

      - name: Logs en cas d'échec
        if: failure()
        run: |
          docker ps -a

          foreach ($container in @($env:CI_POSTGRES_NAME, $env:CI_S3_NAME)) {
            $id = docker ps -aq --filter "name=^$container$"

            if ($id) {
              Write-Host "===== Logs : $container ====="
              docker logs --tail 150 $container
            }
          }

          foreach ($file in @("s3-startup.log", "run1.log", "run2.log")) {
            if (Test-Path $file) {
              Write-Host "===== Fichier : $file ====="
              Get-Content $file
            }
          }

      - name: Nettoyer les conteneurs
        if: always()
        run: |
          foreach ($container in @($env:CI_POSTGRES_NAME, $env:CI_S3_NAME)) {
            $id = docker ps -aq --filter "name=^$container$"

            if ($id) {
              docker rm -f $container
            }
          }

  # =====================================================
  # JOB 5 - DOCKER BUILD
  # =====================================================
  docker-build:
    name: "5 - Docker Build"
    runs-on: ubuntu-latest
    needs:
      - quality
      - unit-tests
      - integration-tests
      - resilience-tests
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: financial-pipeline:ci

      - name: Build terminé
        run: echo "Image Docker construite avec succès."
