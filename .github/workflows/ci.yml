name: Financial Data Pipeline CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Un seul job Windows pour toute la partie Python :
  # une seule installation, un seul PostgreSQL et un seul SeaweedFS.
  pipeline-tests:
    name: "1 - Qualité, tests et flux Data"
    runs-on: [self-hosted, Windows]
    timeout-minutes: 60

    env:
      CI_POSTGRES_NAME: financial-ci-postgres-${{ github.run_id }}-${{ github.run_attempt }}
      CI_S3_NAME: financial-ci-s3-${{ github.run_id }}-${{ github.run_attempt }}

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installation unique des dépendances Python.
      - name: Vérifier Python et installer les dépendances (une seule fois)
        run: |
          py -3.11 --version
          if ($LASTEXITCODE -ne 0) {
            throw "Python 3.11 est requis sur le runner."
          }

          py -3.11 -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) {
            throw "L'installation des dépendances a échoué."
          }


      - name: Qualité du code - Ruff
        run: |
          py -3.11 -m ruff check .
          if ($LASTEXITCODE -ne 0) {
            throw "Ruff a détecté des erreurs."
          }


      - name: Démarrer PostgreSQL (une seule fois)
        run: |
          docker run -d `
            --name $env:CI_POSTGRES_NAME `
            -e POSTGRES_DB=pipeline_test `
            -e POSTGRES_USER=pipeline `
            -e POSTGRES_PASSWORD=pipeline `
            -p 127.0.0.1::5432 `
            postgres:15-alpine

          if ($LASTEXITCODE -ne 0) {
            throw "Impossible de démarrer PostgreSQL."
          }

          $pgPort = $null
          $pgReady = $false

          for ($i = 0; $i -lt 40; $i++) {
            $mapping = docker port $env:CI_POSTGRES_NAME 5432/tcp
            if ($mapping) {
              $pgPort = ($mapping.Trim() -split ":")[-1]
            }

            if ($pgPort) {
              docker exec $env:CI_POSTGRES_NAME pg_isready -U pipeline -d pipeline_test
              if ($LASTEXITCODE -eq 0) {
                $pgReady = $true
                break
              }
            }
            Start-Sleep -Seconds 2
          }

          if (-not $pgReady) {
            docker logs $env:CI_POSTGRES_NAME
            throw "PostgreSQL n'est pas prêt après 80 secondes."
          }

          $pgUrl = "postgresql://pipeline:pipeline@127.0.0.1:$pgPort/pipeline_test"
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "PG_URL=$pgUrl`nDB_URL=$pgUrl`nTEST_DB_URL=$pgUrl`n",
            $utf8
          )

          Write-Host "PostgreSQL prêt sur 127.0.0.1:$pgPort."

      - name: Démarrer SeaweedFS S3 (une seule fois)
        run: |
          docker run -d `
            --name $env:CI_S3_NAME `
            -p 127.0.0.1::8333 `
            chrislusf/seaweedfs:latest `
            server -s3 -dir=/data

          if ($LASTEXITCODE -ne 0) {
            throw "Impossible de démarrer SeaweedFS."
          }

          $s3Port = $null
          $s3Ready = $false

          for ($i = 0; $i -lt 40; $i++) {
            $mapping = docker port $env:CI_S3_NAME 8333/tcp
            if ($mapping) {
              $s3Port = ($mapping.Trim() -split ":")[-1]
            }

            if ($s3Port) {
              $tcp = New-Object System.Net.Sockets.TcpClient
              try {
                $async = $tcp.BeginConnect("127.0.0.1", [int]$s3Port, $null, $null)
                if ($async.AsyncWaitHandle.WaitOne(1000, $false) -and $tcp.Connected) {
                  $tcp.EndConnect($async)
                  $s3Ready = $true
                  break
                }
              }
              catch {
                # Le service n'est pas encore prêt : on réessaie.
              }
              finally {
                $tcp.Close()
              }
            }
            Start-Sleep -Seconds 2
          }

          if (-not $s3Ready) {
            docker logs --tail 150 $env:CI_S3_NAME
            throw "SeaweedFS S3 n'est pas accessible après 80 secondes."
          }

          $endpoint = "http://127.0.0.1:$s3Port"
          $env:S3_ENDPOINT = $endpoint
          $env:TEST_S3_ENDPOINT = $endpoint
          $env:S3_BUCKET = "ci-warmup"

          # Initialisation du client et du bucket une seule fois.
          cmd.exe /d /c "py -3.11 -c `"from src.storage.s3_client import S3Manager; s = S3Manager(); s.wait_until_ready(); s.ensure_bucket_exists()`" > s3-startup.log 2>&1"
          $s3ExitCode = $LASTEXITCODE

          if (Test-Path s3-startup.log) {
            Get-Content s3-startup.log
          }

          if ($s3ExitCode -ne 0) {
            docker logs --tail 150 $env:CI_S3_NAME
            throw "Le client S3 n'a pas réussi à initialiser le bucket."
          }

          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "S3_ENDPOINT=$endpoint`nTEST_S3_ENDPOINT=$endpoint`nS3_BUCKET=ci-warmup`n",
            $utf8
          )

          Write-Host "SeaweedFS S3 prêt sur $endpoint."

      - name: Exécuter toute la suite de tests (une seule fois)
        run: |
          cmd.exe /d /c "py -3.11 -m pytest tests -vv --cov=src --cov-report=term-missing --cov-fail-under=80 > tests.log 2>&1"
          $testExitCode = $LASTEXITCODE

          if (Test-Path tests.log) {
            Get-Content tests.log
          }

          if ($testExitCode -ne 0) {
            throw "La suite de tests ou le seuil de couverture de 80 % a échoué."
          }

          # Vérifie explicitement que le scénario SLM rejoint le même flux.
          if (-not (Select-String -Path tests.log -Pattern "test_text_ingestion_joins_the_same_flow_and_is_idempotent.*PASSED" -Quiet)) {
            throw "Le test d'intégration SLM n'a pas été exécuté avec succès."
          }

          Write-Host "Validation SLM : extraction texte -> flux commun -> idempotence."

      - name: Réinitialiser la base avant le test réel de la pipeline
        run: |
          cmd.exe /d /c "py -3.11 -c `"from src.db.connection import reset_db; reset_db()`" > reset-db.log 2>&1"
          $resetExitCode = $LASTEXITCODE

          if (Test-Path reset-db.log) {
            Get-Content reset-db.log
          }

          if ($resetExitCode -ne 0) {
            throw "Impossible de réinitialiser la base de test."
          }

      - name: Exécuter la pipeline avec simulation des pannes (S3 + DB)
        env:
          SIMULATE_DB_FAILURES: "2"
          SIMULATE_S3_FAILURES: "2"
          RETRY_MAX_ATTEMPTS: "3"
          RETRY_WAIT_SECONDS: "0.5"
        run: |
          cmd.exe /d /c "py -3.11 -m src.pipeline.main > run1.log 2>&1"
          $pipelineExitCode = $LASTEXITCODE

          Write-Host "===== FLUX CSV / S3 / VALIDATION / TRAITEMENT / DB ====="
          if (Test-Path run1.log) {
            Get-Content run1.log
          }

          if ($pipelineExitCode -ne 0) {
            throw "La pipeline a échoué (code $pipelineExitCode)."
          }

          @'
          import re
          import sys
          from pathlib import Path

          log = Path("run1.log").read_text(encoding="utf-8", errors="replace")
          match = re.search(r"Bilan\s*:\s*(\d+)\s+.*?,\s*(\d+)\s+.*?,\s*(\d+)", log)
          if not match:
              raise SystemExit("Bilan de pipeline introuvable dans run1.log")

          actual = tuple(map(int, match.groups()))
          expected = (3, 0, 0)
          if actual != expected:
              raise SystemExit(f"Bilan incorrect : {actual}, attendu : {expected}")

          for service in ("s3", "db"):
              if f"panne temporaire '{service}'" not in log:
                  raise SystemExit(f"La panne simulée {service} n'apparaît pas dans le journal.")

          print("Résilience validée : 3 fichiers traités, retries S3 et DB observés.")
          '@ | Set-Content -Path validate_run1.py -Encoding utf8

          py -3.11 validate_run1.py
          if ($LASTEXITCODE -ne 0) {
            throw "La validation de la résilience a échoué."
          }

      - name: Vérifier l'idempotence (seconde exécution)
        env:
          RETRY_MAX_ATTEMPTS: "3"
          RETRY_WAIT_SECONDS: "0.5"
        run: |
          cmd.exe /d /c "py -3.11 -m src.pipeline.main > run2.log 2>&1"
          $pipelineExitCode = $LASTEXITCODE

          Write-Host "===== SECONDE EXECUTION / IDEMPOTENCE ====="
          if (Test-Path run2.log) {
            Get-Content run2.log
          }

          if ($pipelineExitCode -ne 0) {
            throw "La seconde exécution de la pipeline a échoué."
          }

          @'
          import re
          from pathlib import Path

          log = Path("run2.log").read_text(encoding="utf-8", errors="replace")
          match = re.search(r"Bilan\s*:\s*(\d+)\s+.*?,\s*(\d+)\s+.*?,\s*(\d+)", log)
          if not match:
              raise SystemExit("Bilan de la seconde exécution introuvable.")

          actual = tuple(map(int, match.groups()))
          expected = (0, 3, 0)
          if actual != expected:
              raise SystemExit(f"Idempotence incorrecte : {actual}, attendu : {expected}")

          print("Idempotence validée : aucun des 3 fichiers n'a été retraité.")
          '@ | Set-Content -Path validate_run2.py -Encoding utf8

          py -3.11 validate_run2.py
          if ($LASTEXITCODE -ne 0) {
            throw "Le contrôle d'idempotence a échoué."
          }

      - name: Afficher les diagnostics en cas d'échec
        if: failure()
        run: |
          Write-Host "===== CONTENEURS ====="
          docker ps -a

          foreach ($container in @($env:CI_POSTGRES_NAME, $env:CI_S3_NAME)) {
            $exists = docker container inspect $container 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "===== LOGS $container ====="
              docker logs --tail 200 $container
            }
          }

          foreach ($file in @("s3-startup.log", "tests.log", "reset-db.log", "run1.log", "run2.log")) {
            if (Test-Path $file) {
              Write-Host "===== $file ====="
              Get-Content $file
            }
          }

      # Ne supprime que les deux conteneurs créés par CE workflow.
      - name: Nettoyer les services CI
        if: always()
        run: |
          foreach ($container in @($env:CI_POSTGRES_NAME, $env:CI_S3_NAME)) {
            docker container inspect $container *> $null
            if ($LASTEXITCODE -eq 0) {
              docker rm -f $container
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Impossible de supprimer $container."
              }
            }
          }

  # Le build Docker est séparé, mais ne réinstalle aucune dépendance Python.
  docker-build:
    name: "2 - Build Docker"
    runs-on: ubuntu-latest
    needs: pipeline-tests
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image de la pipeline
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: financial-pipeline:ci

      - name: Build terminé
        run: echo "Image Docker construite avec succès."
