
name: Financial Data Pipeline CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: "1 - Code Quality"
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier Python
        shell: powershell
        run: |
          py -3.11 --version
          if ($LASTEXITCODE -ne 0) {
            throw "Python 3.11 est introuvable."
          }

      - name: Installer les dépendances
        shell: powershell
        run: |
          py -3.11 -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "Mise à jour de pip impossible." }

          py -3.11 -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Installation impossible." }

      - name: Analyse statique Ruff
        shell: powershell
        run: |
          py -3.11 -m ruff check .
          if ($LASTEXITCODE -ne 0) {
            throw "Ruff a détecté des erreurs."
          }

  pipeline-tests:
    name: "2 - Integration & Pipeline Tests"
    runs-on: [self-hosted, Windows]
    timeout-minutes: 40
    needs: quality

    env:
      CI_POSTGRES_NAME: ci-postgres-${{ github.run_id }}-${{ github.run_attempt }}
      CI_S3_NAME: ci-s3-${{ github.run_id }}-${{ github.run_attempt }}
      RETRY_MAX_ATTEMPTS: "10"
      RETRY_WAIT_SECONDS: "1"

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les dépendances
        run: |
          py -3.11 -m pip install --upgrade pip
          py -3.11 -m pip install -r requirements-dev.txt

          if ($LASTEXITCODE -ne 0) {
            throw "Installation des dépendances impossible."
          }

      - name: Démarrer PostgreSQL
        run: |
          docker run -d `
            --name $env:CI_POSTGRES_NAME `
            -e POSTGRES_DB=pipeline_test `
            -e POSTGRES_USER=pipeline `
            -e POSTGRES_PASSWORD=pipeline `
            -p 127.0.0.1::5432 `
            postgres:15-alpine

          if ($LASTEXITCODE -ne 0) {
            throw "Impossible de démarrer PostgreSQL."
          }

          $pgPort = $null

          for ($i = 0; $i -lt 30; $i++) {
            $mapping = docker port $env:CI_POSTGRES_NAME 5432/tcp
            if ($mapping) {
              $pgPort = ($mapping.Trim() -split ":")[-1]
            }

            if ($pgPort) {
              docker exec $env:CI_POSTGRES_NAME pg_isready -U pipeline -d pipeline_test
              if ($LASTEXITCODE -eq 0) { break }
            }

            Start-Sleep -Seconds 2
          }

          if (-not $pgPort) {
            docker logs $env:CI_POSTGRES_NAME
            throw "Port PostgreSQL introuvable."
          }

          $pgUrl = "postgresql://pipeline:pipeline@127.0.0.1:$pgPort/pipeline_test"

          "PG_URL=$pgUrl" >> $env:GITHUB_ENV
          "TEST_DB_URL=$pgUrl" >> $env:GITHUB_ENV
          "DB_URL=$pgUrl" >> $env:GITHUB_ENV

          Write-Host "PostgreSQL prêt sur le port $pgPort."

      - name: Démarrer SeaweedFS S3
        run: |
          docker run -d `
            --name $env:CI_S3_NAME `
            -p 127.0.0.1::8333 `
            chrislusf/seaweedfs:latest `
            server -s3 -dir=/data

          if ($LASTEXITCODE -ne 0) {
            throw "Impossible de démarrer SeaweedFS."
          }

          $s3Port = $null
          $ready = $false

          for ($i = 0; $i -lt 30; $i++) {
            $mapping = docker port $env:CI_S3_NAME 8333/tcp
            if ($mapping) {
              $s3Port = ($mapping.Trim() -split ":")[-1]
            }

            if ($s3Port) {
              $endpoint = "http://127.0.0.1:$s3Port"
              $env:S3_ENDPOINT = $endpoint
              $env:TEST_S3_ENDPOINT = $endpoint
              $env:S3_BUCKET = "ci-warmup"

              py -3.11 -c "from src.storage.s3_client import S3Manager; s = S3Manager(); s.wait_until_ready(); s.ensure_bucket_exists()"

              if ($LASTEXITCODE -eq 0) {
                $ready = $true
                break
              }
            }

            Start-Sleep -Seconds 2
          }

          if (-not $ready) {
            docker ps -a
            docker logs $env:CI_S3_NAME
            throw "SeaweedFS n'est pas disponible."
          }

          "S3_ENDPOINT=$endpoint" >> $env:GITHUB_ENV
          "TEST_S3_ENDPOINT=$endpoint" >> $env:GITHUB_ENV
          "S3_BUCKET=ci-warmup" >> $env:GITHUB_ENV

          Write-Host "SeaweedFS prêt sur $endpoint."

      - name: Exécuter les tests automatisés
        run: |
          py -3.11 -m pytest tests -v --cov=src --cov-report=term-missing --cov-fail-under=80

          if ($LASTEXITCODE -ne 0) {
            throw "Les tests automatisés ont échoué."
          }

      - name: Réinitialiser la base avant la simulation
        run: |
          py -3.11 -c "from src.db.connection import reset_db; reset_db()"

          if ($LASTEXITCODE -ne 0) {
            throw "Réinitialisation de la base impossible."
          }

      - name: Tester la résilience aux pannes
        env:
          SIMULATE_DB_FAILURES: "2"
          SIMULATE_S3_FAILURES: "2"
          RETRY_WAIT_SECONDS: "0.5"
        run: |
          py -3.11 -m src.pipeline.main *> run1.log
          $exitCode = $LASTEXITCODE

          Get-Content run1.log

          if ($exitCode -ne 0) {
            throw "La simulation des pannes a échoué."
          }

          $patterns = @(
            "3 trait.+\(s\), 0 ignor.+\(s\)",
            "panne temporaire 'db'",
            "panne temporaire 's3'"
          )

          foreach ($pattern in $patterns) {
            if (-not (Select-String -Path run1.log -Pattern $pattern -Quiet)) {
              throw "Résultat attendu absent : $pattern"
            }
          }

          Write-Host "Résilience validée."

      - name: Tester l'idempotence
        run: |
          py -3.11 -m src.pipeline.main *> run2.log
          $exitCode = $LASTEXITCODE

          Get-Content run2.log

          if ($exitCode -ne 0) {
            throw "La seconde exécution a échoué."
          }

          if (-not (Select-String -Path run2.log -Pattern "0 trait.+\(s\), 3 ignor.+\(s\)" -Quiet)) {
            throw "Idempotence non respectée."
          }

          Write-Host "Idempotence validée."

      - name: Récupérer les logs en cas d'échec
        if: failure()
        run: |
          docker ps -a

          foreach ($container in @($env:CI_POSTGRES_NAME, $env:CI_S3_NAME)) {
            $id = docker ps -aq --filter "name=^$container$"
            if ($id) {
              docker logs --tail 100 $container
            }
          }

          foreach ($file in @("run1.log", "run2.log")) {
            if (Test-Path $file) { Get-Content $file }
          }

      - name: Nettoyer les conteneurs de test
        if: always()
        run: |
          foreach ($container in @($env:CI_POSTGRES_NAME, $env:CI_S3_NAME)) {
            $id = docker ps -aq --filter "name=^$container$"
            if ($id) {
              docker rm -f $container
            }
          }

          Write-Host "Nettoyage terminé."
