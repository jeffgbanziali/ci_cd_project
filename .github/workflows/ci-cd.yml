          if (docker ps -aq --filter "name=^$name$") { docker rm -f $name }
          docker run -d --name $name -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=financial_test -p 127.0.0.1::5432 postgres:16
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Le conteneur PostgreSQL n'a pas demarre"
            exit 1
          }
          $port = ((docker port $name 5432/tcp | Select-Object -First 1) -split ":")[-1]
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            docker exec $name pg_isready -h 127.0.0.1 -U postgres -d financial_test
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            docker logs --tail 40 $name
            Write-Host "::error::PostgreSQL n'est pas pret apres 60 s"
            exit 1
          }
          $url = "postgresql://postgres:postgres@127.0.0.1:$port/financial_test"
          "PG_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DB_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEST_DB_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PostgreSQL pret sur le port $port"
          exit 0

      - name: Start SeaweedFS S3
        run: |
          $ErrorActionPreference = "Continue"
          $name = "fpipe-ci-s3-resilience"
          if (docker ps -aq --filter "name=^$name$") { docker rm -f $name }
          docker run -d --name $name -p 127.0.0.1::8333 chrislusf/seaweedfs:latest server -s3
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Le conteneur SeaweedFS n'a pas demarre"
            exit 1
          }
          $port = ((docker port $name 8333/tcp | Select-Object -First 1) -split ":")[-1]
          $endpoint = "http://127.0.0.1:$port"
          $ready = $false
          for ($i = 0; $i -lt 40; $i++) {
            try {
              Invoke-WebRequest -Uri $endpoint -TimeoutSec 2 -UseBasicParsing | Out-Null
              $ready = $true; break
            } catch {
              if ($_.Exception.Response) { $ready = $true; break }
              Start-Sleep -Seconds 2
            }
          }
          if (-not $ready) {
            docker logs --tail 40 $name
            Write-Host "::error::SeaweedFS n'est pas pret"
            exit 1
          }
          $env:S3_ENDPOINT = $endpoint
          $env:S3_BUCKET = "ci-warmup"
          $env:RETRY_MAX_ATTEMPTS = "10"
          $env:RETRY_WAIT_SECONDS = "1"
          python -c "from src.storage.s3_client import S3Manager; s = S3Manager(); s.wait_until_ready(); s.ensure_bucket_exists(); open('warmup.csv', 'w').write('x'); s.upload_file('warmup.csv', 'warmup.csv')"
          if ($LASTEXITCODE -ne 0) {
            docker logs --tail 40 $name
            Write-Host "::error::S3 ne repond pas a une ecriture de test"
            exit 1
          }
          Remove-Item warmup.csv -ErrorAction SilentlyContinue
          "S3_ENDPOINT=$endpoint" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEST_S3_ENDPOINT=$endpoint" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "S3_BUCKET=financial-test" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "S3 pret sur le port $port"
          exit 0

      - name: Run retry and resilience tests
        run: |
          python -m pytest tests/integration -vv -k "retry or unreachable"
          exit $LASTEXITCODE

      - name: Diagnostics
        if: failure()
        run: |
          foreach ($c in "fpipe-ci-pg-resilience", "fpipe-ci-s3-resilience") {
            if (docker ps -aq --filter "name=^$c$") {
              Write-Host "===== logs $c ====="
              docker logs --tail 60 $c
            }
          }
          exit 0

      - name: Cleanup
        if: always()
        run: |
          foreach ($c in "fpipe-ci-pg-resilience", "fpipe-ci-s3-resilience") {
            if (docker ps -aq --filter "name=^$c$") { docker rm -f $c }
          }
          exit 0

  pipeline-e2e:
    name: "7 - End-to-end pipeline"
    runs-on: [self-hosted, Windows]
    needs: resilience-tests
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use host Python 3.11
        run: |
          $exe = $null
          if (Get-Command py -ErrorAction SilentlyContinue) {
            $exe = py -3.11 -c "import sys; print(sys.executable)"
            if ($LASTEXITCODE -ne 0) { $exe = $null }
          }
          if (-not $exe) { $exe = python -c "import sys; print(sys.executable)" }
          if (-not $exe) { Write-Host "::error::Python introuvable sur le runner"; exit 1 }
          $dir = Split-Path -Parent $exe
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $dir "Scripts") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $exe -c "import sys; assert sys.version_info[:2] == (3, 11), 'Python 3.11 requis'"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Python 3.11 requis"; exit 1 }
      - name: Start PostgreSQL
        run: |
          $ErrorActionPreference = "Continue"
          $name = "fpipe-ci-pg-e2e"
          if (docker ps -aq --filter "name=^$name$") { docker rm -f $name }
          docker run -d --name $name -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=financial_test -p 127.0.0.1::5432 postgres:16
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Le conteneur PostgreSQL n'a pas demarre"
            exit 1
          }
          $port = ((docker port $name 5432/tcp | Select-Object -First 1) -split ":")[-1]
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            docker exec $name pg_isready -h 127.0.0.1 -U postgres -d financial_test
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            docker logs --tail 40 $name
            Write-Host "::error::PostgreSQL n'est pas pret apres 60 s"
            exit 1
          }
          $url = "postgresql://postgres:postgres@127.0.0.1:$port/financial_test"
          "PG_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DB_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEST_DB_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PostgreSQL pret sur le port $port"
          exit 0

      - name: Start SeaweedFS S3
        run: |
          $ErrorActionPreference = "Continue"
          $name = "fpipe-ci-s3-e2e"
          if (docker ps -aq --filter "name=^$name$") { docker rm -f $name }
          docker run -d --name $name -p 127.0.0.1::8333 chrislusf/seaweedfs:latest server -s3
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Le conteneur SeaweedFS n'a pas demarre"
            exit 1
          }
          $port = ((docker port $name 8333/tcp | Select-Object -First 1) -split ":")[-1]
          $endpoint = "http://127.0.0.1:$port"
          $ready = $false
          for ($i = 0; $i -lt 40; $i++) {
            try {
              Invoke-WebRequest -Uri $endpoint -TimeoutSec 2 -UseBasicParsing | Out-Null
              $ready = $true; break
            } catch {
              if ($_.Exception.Response) { $ready = $true; break }
              Start-Sleep -Seconds 2
            }
          }
          if (-not $ready) {
            docker logs --tail 40 $name
            Write-Host "::error::SeaweedFS n'est pas pret"
            exit 1
          }
          $env:S3_ENDPOINT = $endpoint
          $env:S3_BUCKET = "ci-warmup"
          $env:RETRY_MAX_ATTEMPTS = "10"
          $env:RETRY_WAIT_SECONDS = "1"
          python -c "from src.storage.s3_client import S3Manager; s = S3Manager(); s.wait_until_ready(); s.ensure_bucket_exists(); open('warmup.csv', 'w').write('x'); s.upload_file('warmup.csv', 'warmup.csv')"
          if ($LASTEXITCODE -ne 0) {
            docker logs --tail 40 $name
            Write-Host "::error::S3 ne repond pas a une ecriture de test"
            exit 1
          }
          Remove-Item warmup.csv -ErrorAction SilentlyContinue
          "S3_ENDPOINT=$endpoint" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEST_S3_ENDPOINT=$endpoint" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "S3_BUCKET=financial-test" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "S3 pret sur le port $port"
          exit 0

      - name: Reset database
        run: |
          python -c "from src.db.connection import reset_db; reset_db()"
          exit $LASTEXITCODE

      - name: Run pipeline and verify first ingestion
        run: |
          $ErrorActionPreference = "Continue"
          # le point d'entree depend de votre arborescence : src/pipeline/main.py (ou src/main.py)
          $module = "src.pipeline.main"
          if (-not (Test-Path "src/pipeline/main.py") -and (Test-Path "src/main.py")) { $module = "src.main" }
          Write-Host "Module lance : $module"
          $log = "pipeline-e2e-first.log"
          # FIX 3 : "2>&1" brut fait echouer PowerShell 5.1 sur les logs Python (stderr) ; on les convertit en texte
          python -m $module 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::L'execution de la pipeline a echoue"
            exit 1
          }
          # FIX 3 (suite) : lecture du log (UTF-16 sous PowerShell 5.1) et motif sans accents (la console reencode les "e accent")
          $text = Get-Content -Raw -Path $log
          $pattern = '(\d+)\s+trait\S*\(s\),\s*(\d+)\s+ignor\S*\(s\),\s*(\d+)\s+invalide\S*\(s\)'
          $m = [regex]::Matches($text, $pattern, 'IgnoreCase')
          if ($m.Count -eq 0) {
            Write-Host "::error::Bilan de la pipeline introuvable dans les logs"
            exit 1
          }
          $last = $m[$m.Count - 1]
          $got = "$($last.Groups[1].Value),$($last.Groups[2].Value),$($last.Groups[3].Value)"
          if ($got -ne "3,0,0") {
            Write-Host "::error::Bilan inattendu (traites,ignores,invalides) = $got ; attendu 3,0,0"
            exit 1
          }
          Write-Host "Premiere ingestion verifiee : 3 traites, 0 ignores, 0 invalides"
          exit 0

      - name: Run pipeline again and verify idempotence
        run: |
          $ErrorActionPreference = "Continue"
          $module = "src.pipeline.main"
          if (-not (Test-Path "src/pipeline/main.py") -and (Test-Path "src/main.py")) { $module = "src.main" }
          Write-Host "Module lance : $module"
          $log = "pipeline-e2e-second.log"
          python -m $module 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::L'execution de la pipeline a echoue"
            exit 1
          }
          $text = Get-Content -Raw -Path $log
          $pattern = '(\d+)\s+trait\S*\(s\),\s*(\d+)\s+ignor\S*\(s\),\s*(\d+)\s+invalide\S*\(s\)'
          $m = [regex]::Matches($text, $pattern, 'IgnoreCase')
          if ($m.Count -eq 0) {
            Write-Host "::error::Bilan de la pipeline introuvable dans les logs"
            exit 1
          }
          $last = $m[$m.Count - 1]
          $got = "$($last.Groups[1].Value),$($last.Groups[2].Value),$($last.Groups[3].Value)"
          if ($got -ne "0,3,0") {
            Write-Host "::error::Bilan inattendu (traites,ignores,invalides) = $got ; attendu 0,3,0"
            exit 1
          }
          Write-Host "Idempotence verifiee : 0 traites, 3 ignores, 0 invalides"
          exit 0

      - name: Diagnostics
        if: failure()
        run: |
          foreach ($c in "fpipe-ci-pg-e2e", "fpipe-ci-s3-e2e") {
            if (docker ps -aq --filter "name=^$c$") {
              Write-Host "===== logs $c ====="
              docker logs --tail 60 $c
            }
          }
          exit 0

      - name: Cleanup
        if: always()
        run: |
          foreach ($c in "fpipe-ci-pg-e2e", "fpipe-ci-s3-e2e") {
            if (docker ps -aq --filter "name=^$c$") { docker rm -f $c }
          }
          exit 0

  docker-build:
    name: "8 - Docker image build"
    runs-on: [self-hosted, Windows]
    needs: pipeline-e2e
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application image
        run: |
          docker build -t financial-data-pipeline:ci .
          exit $LASTEXITCODE

      - name: Cleanup
        if: always()
        run: |
          if (docker images -q financial-data-pipeline:ci) { docker rmi -f financial-data-pipeline:ci }
          exit 0

  # =====================================================
  # JOB 9 - BUILD, TRANSFER AND DOCKER COMPOSE DEPLOYMENT
  # =====================================================
  deploy:
    name: "9 - Deploy to production with Docker Compose"
    runs-on: [self-hosted, Windows, X64]
    needs: docker-build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' && github.event_name == 'push')
    timeout-minutes: 40
    environment: production

    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
      PROD_POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
      VM_APP_DIR: /home/ubuntu/financial-pipeline/runtime
      IMAGE_NAME: financial-pipeline
      IMAGE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}



      - name: Build and export Docker image
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:IMAGE_SHA.Substring(0, 12)

          docker build --platform linux/amd64 `
            -t "$env:IMAGE_NAME`:$tag" `
            -t "$env:IMAGE_NAME`:latest" .

          if ($LASTEXITCODE -ne 0) {
            throw "La construction de l'image Docker a échoué."
          }

          docker save -o image.tar "$env:IMAGE_NAME`:$tag" "$env:IMAGE_NAME`:latest"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "image.tar")) {
            throw "L'export de l'image Docker a échoué."
          }

          "DEPLOY_IMAGE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Image construite : $env:IMAGE_NAME`:$tag"

      - name: Install Paramiko
        run: |
          python -m pip install paramiko
          if ($LASTEXITCODE -ne 0) {
            throw "Impossible d'installer Paramiko."
          }

      - name: Transfer image and production configuration to VM
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import os
          import sys
          import shlex
          import paramiko

          host = os.environ["VM_HOST"]
          user = os.environ["VM_USER"]
          password = os.environ["VM_PASSWORD"]
          app_dir = os.environ["VM_APP_DIR"]
          image_tag = os.environ["DEPLOY_IMAGE_TAG"]
          postgres_password = os.environ["PROD_POSTGRES_PASSWORD"]

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())

          def run_remote(command):
              _stdin, stdout, stderr = client.exec_command(command, timeout=900)
              code = stdout.channel.recv_exit_status()
              out = stdout.read().decode("utf-8", errors="replace")
              err = stderr.read().decode("utf-8", errors="replace")
              if out:
                  print(out)
              if code != 0:
                  if err:
                      print(err, file=sys.stderr)
                  raise RuntimeError("Commande distante en échec (code %s)" % code)

          def dotenv_quote(value):
              value = value.replace("\\", "\\\\").replace('"', '\\"').replace("\n", "")
              return '"' + value + '"'

          try:
              print("Connexion SSH à la VM...")
              client.connect(
                  hostname=host,
                  username=user,
                  password=password,
                  timeout=30,
                  look_for_keys=False,
                  allow_agent=False,
              )

              safe_dir = shlex.quote(app_dir)
              run_remote("test -d " + safe_dir)

              sftp = client.open_sftp()
              sftp.put("image.tar", app_dir + "/image.tar")
              sftp.put("docker-compose.prod.yml", app_dir + "/docker-compose.prod.yml")

              # Conserver les autres variables du .env et ne mettre à jour que celles du déploiement.
              env_path = app_dir + "/.env"
              try:
                  with sftp.file(env_path, "r") as f:
                      lines = f.read().decode("utf-8").splitlines()
              except IOError:
                  lines = []

              updates = {
                  "POSTGRES_PASSWORD": postgres_password,
                  "PIPELINE_IMAGE": "financial-pipeline:" + image_tag,
                  "SCHEDULE_SECONDS": "300",
                  "S3_ACCESS_KEY": "minioadmin",
                  "S3_SECRET_KEY": "minioadminpassword",
                  "S3_BUCKET": "transactions-bucket",
              }

              for key, value in updates.items():
                  lines = [line for line in lines if not line.startswith(key + "=")]
                  lines.append(key + "=" + dotenv_quote(value))

              with sftp.file(env_path, "w") as f:
                  f.write("\n".join(lines) + "\n")
              sftp.chmod(env_path, 0o600)
              sftp.close()

              print("Image et configuration transférées.")

              # Charger l'image puis appliquer directement le déploiement Docker Compose.
              run_remote("cd " + safe_dir + " && docker load -i image.tar")
              print("Image chargée sur la VM.")
              run_remote("cd " + safe_dir + " && docker compose -p financial-pipeline -f docker-compose.prod.yml config --quiet")
              run_remote("cd " + safe_dir + " && docker compose -p financial-pipeline -f docker-compose.prod.yml up -d --no-build")
              run_remote("cd " + safe_dir + " && docker compose -p financial-pipeline -f docker-compose.prod.yml ps")
              print("Déploiement Docker Compose terminé.")
          finally:
              client.close()
          '@ | Set-Content -Path transfer_production.py -Encoding UTF8

          python transfer_production.py
          if ($LASTEXITCODE -ne 0) {
            throw "Le transfert ou le chargement de l'image sur la VM a échoué."
          }

      - name: Deployment summary
        if: success()
        run: |
          Write-Host "=============================================="
          Write-Host "DEPLOIEMENT DE PRODUCTION TERMINE"
          Write-Host "Commit : $env:IMAGE_SHA"
          Write-Host "Image : $env:IMAGE_NAME`:$env:DEPLOY_IMAGE_TAG"
          Write-Host "VM : $env:VM_HOST"
          Write-Host "Déploiement : Docker Compose"
          Write-Host "=============================================="

      - name: Remove temporary deployment files
        if: always()
        run: |
          Remove-Item image.tar, transfer_production.py `
            -Force -ErrorAction SilentlyContinue
