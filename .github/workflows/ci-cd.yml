name: Financial Data Pipeline CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: powershell

# Un nouveau push sur la meme branche annule le run precedent (un seul runner local).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Les jobs Windows sont chaines sur l'unique runner self-hosted.
# Python 3.11 est celui de la machine (actions/setup-python est inutilisable ici : voir FIX 1).
jobs:
  dependencies:
    name: "1 - Dependencies"
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use host Python 3.11
        run: |
          # FIX 1 : plus de actions/setup-python (le chemin "Pret Jeff" contient un espace) : Python 3.11 de la machine
          $exe = $null
          if (Get-Command py -ErrorAction SilentlyContinue) {
            $exe = py -3.11 -c "import sys; print(sys.executable)"
            if ($LASTEXITCODE -ne 0) { $exe = $null }
          }
          if (-not $exe) { $exe = python -c "import sys; print(sys.executable)" }
          if (-not $exe) { Write-Host "::error::Python introuvable sur le runner"; exit 1 }
          $dir = Split-Path -Parent $exe
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $dir "Scripts") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $exe -c "import sys; assert sys.version_info[:2] == (3, 11), 'Python 3.11 requis'"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Python 3.11 requis"; exit 1 }
      - name: Check Python
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 11), 'Python 3.11 is required'"
          exit $LASTEXITCODE

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-dev.txt
          exit $LASTEXITCODE

      - name: Verify required tools
        run: |
          python -c "import pytest, ruff, pandas, sqlalchemy, psycopg2, boto3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # FIX 7 : "pip check" verifie TOUS les paquets de la machine (pas seulement ceux du projet) :
          # un conflit sans rapport avec le projet ne doit pas faire echouer la CI -> simple avertissement
          python -m pip check
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::pip check signale des conflits de paquets (voir ci-dessus)" }
          # Docker est indispensable pour les jobs 5, 6 et 7 : on echoue tout de suite avec un message clair
          $os = docker info --format "{{.OSType}}"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Docker Desktop n'est pas demarre sur la machine du runner"
            exit 1
          }
          if ($os -ne "linux") {
            Write-Host "::error::Docker Desktop doit etre en mode conteneurs Linux (actuellement : $os)"
            exit 1
          }
          exit 0

  quality:
    name: "2 - Code quality"
    runs-on: [self-hosted, Windows]
    needs: dependencies
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use host Python 3.11
        run: |
          $exe = $null
          if (Get-Command py -ErrorAction SilentlyContinue) {
            $exe = py -3.11 -c "import sys; print(sys.executable)"
            if ($LASTEXITCODE -ne 0) { $exe = $null }
          }
          if (-not $exe) { $exe = python -c "import sys; print(sys.executable)" }
          if (-not $exe) { Write-Host "::error::Python introuvable sur le runner"; exit 1 }
          $dir = Split-Path -Parent $exe
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $dir "Scripts") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $exe -c "import sys; assert sys.version_info[:2] == (3, 11), 'Python 3.11 requis'"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Python 3.11 requis"; exit 1 }
      - name: Ruff lint
        run: |
          python -m ruff check .
          exit $LASTEXITCODE

  unit-tests:
    name: "3 - Unit tests"
    runs-on: [self-hosted, Windows]
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use host Python 3.11
        run: |
          $exe = $null
          if (Get-Command py -ErrorAction SilentlyContinue) {
            $exe = py -3.11 -c "import sys; print(sys.executable)"
            if ($LASTEXITCODE -ne 0) { $exe = $null }
          }
          if (-not $exe) { $exe = python -c "import sys; print(sys.executable)" }
          if (-not $exe) { Write-Host "::error::Python introuvable sur le runner"; exit 1 }
          $dir = Split-Path -Parent $exe
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $dir "Scripts") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $exe -c "import sys; assert sys.version_info[:2] == (3, 11), 'Python 3.11 requis'"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Python 3.11 requis"; exit 1 }
      - name: Run unit tests (excluding dedicated SLM tests)
        run: |
          python -m pytest tests/unit -vv --ignore=tests/unit/test_slm_extractor.py
          exit $LASTEXITCODE

  slm-tests:
    name: "4 - SLM extraction tests"
    runs-on: [self-hosted, Windows]
    needs: unit-tests
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use host Python 3.11
        run: |
          $exe = $null
          if (Get-Command py -ErrorAction SilentlyContinue) {
            $exe = py -3.11 -c "import sys; print(sys.executable)"
            if ($LASTEXITCODE -ne 0) { $exe = $null }
          }
          if (-not $exe) { $exe = python -c "import sys; print(sys.executable)" }
          if (-not $exe) { Write-Host "::error::Python introuvable sur le runner"; exit 1 }
          $dir = Split-Path -Parent $exe
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $dir "Scripts") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $exe -c "import sys; assert sys.version_info[:2] == (3, 11), 'Python 3.11 requis'"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Python 3.11 requis"; exit 1 }
      - name: Run SLM extractor tests
        run: |
          python -m pytest tests/unit/test_slm_extractor.py -vv
          exit $LASTEXITCODE

  integration-tests:
    name: "5 - Integration tests"
    runs-on: [self-hosted, Windows]
    needs: slm-tests
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use host Python 3.11
        run: |
          $exe = $null
          if (Get-Command py -ErrorAction SilentlyContinue) {
            $exe = py -3.11 -c "import sys; print(sys.executable)"
            if ($LASTEXITCODE -ne 0) { $exe = $null }
          }
          if (-not $exe) { $exe = python -c "import sys; print(sys.executable)" }
          if (-not $exe) { Write-Host "::error::Python introuvable sur le runner"; exit 1 }
          $dir = Split-Path -Parent $exe
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $dir "Scripts") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $exe -c "import sys; assert sys.version_info[:2] == (3, 11), 'Python 3.11 requis'"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Python 3.11 requis"; exit 1 }
      - name: Start PostgreSQL
        run: |
          $ErrorActionPreference = "Continue"
          $name = "fpipe-ci-pg-integration"
          if (docker ps -aq --filter "name=^$name$") { docker rm -f $name }
          docker run -d --name $name -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=financial_test -p 127.0.0.1::5432 postgres:16
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Le conteneur PostgreSQL n'a pas demarre"
            exit 1
          }
          $port = ((docker port $name 5432/tcp | Select-Object -First 1) -split ":")[-1]
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            # FIX 4 : "-h 127.0.0.1" force le test en TCP (pendant l'initialisation, Postgres repond deja sur son socket interne)
            docker exec $name pg_isready -h 127.0.0.1 -U postgres -d financial_test
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            docker logs --tail 40 $name
            Write-Host "::error::PostgreSQL n'est pas pret apres 60 s"
            exit 1
          }
          $url = "postgresql://postgres:postgres@127.0.0.1:$port/financial_test"
          "PG_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DB_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEST_DB_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PostgreSQL pret sur le port $port"
          exit 0

      - name: Start SeaweedFS S3
        run: |
          $ErrorActionPreference = "Continue"
          $name = "fpipe-ci-s3-integration"
          if (docker ps -aq --filter "name=^$name$") { docker rm -f $name }
          docker run -d --name $name -p 127.0.0.1::8333 chrislusf/seaweedfs:latest server -s3
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Le conteneur SeaweedFS n'a pas demarre"
            exit 1
          }
          $port = ((docker port $name 8333/tcp | Select-Object -First 1) -split ":")[-1]
          $endpoint = "http://127.0.0.1:$port"
          $ready = $false
          for ($i = 0; $i -lt 40; $i++) {
            try {
              Invoke-WebRequest -Uri $endpoint -TimeoutSec 2 -UseBasicParsing | Out-Null
              $ready = $true; break
            } catch {
              # FIX 5 : une reponse HTTP d'erreur (403...) prouve que S3 repond ; seule une absence de reponse = pas pret
              if ($_.Exception.Response) { $ready = $true; break }
              Start-Sleep -Seconds 2
            }
          }
          if (-not $ready) {
            docker logs --tail 40 $name
            Write-Host "::error::SeaweedFS n'est pas pret"
            exit 1
          }
          # FIX 6 : SeaweedFS peut refuser la toute premiere ECRITURE juste apres son demarrage.
          # On l'echauffe avec le code du projet (bucket dedie) pour eviter des tests intermittents.
          $env:S3_ENDPOINT = $endpoint
          $env:S3_BUCKET = "ci-warmup"
          $env:RETRY_MAX_ATTEMPTS = "10"
          $env:RETRY_WAIT_SECONDS = "1"
          python -c "from src.storage.s3_client import S3Manager; s = S3Manager(); s.wait_until_ready(); s.ensure_bucket_exists(); open('warmup.csv', 'w').write('x'); s.upload_file('warmup.csv', 'warmup.csv')"
          if ($LASTEXITCODE -ne 0) {
            docker logs --tail 40 $name
            Write-Host "::error::S3 ne repond pas a une ecriture de test"
            exit 1
          }
          Remove-Item warmup.csv -ErrorAction SilentlyContinue
          "S3_ENDPOINT=$endpoint" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEST_S3_ENDPOINT=$endpoint" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "S3_BUCKET=financial-test" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "S3 pret sur le port $port"
          exit 0

      - name: Run integration tests
        run: |
          python -m pytest tests/integration -vv
          exit $LASTEXITCODE

      - name: Diagnostics
        if: failure()
        run: |
          # FIX 2 : plus de "2>$null" (PowerShell 5.1 le traite comme une erreur) -> on teste l'existence du conteneur
          foreach ($c in "fpipe-ci-pg-integration", "fpipe-ci-s3-integration") {
            if (docker ps -aq --filter "name=^$c$") {
              Write-Host "===== logs $c ====="
              docker logs --tail 60 $c
            }
          }
          exit 0

      - name: Cleanup
        if: always()
        run: |
          foreach ($c in "fpipe-ci-pg-integration", "fpipe-ci-s3-integration") {
            if (docker ps -aq --filter "name=^$c$") { docker rm -f $c }
          }
          exit 0

  resilience-tests:
    name: "6 - Retry and resilience tests"
    runs-on: [self-hosted, Windows]
    needs: integration-tests
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use host Python 3.11
        run: |
          $exe = $null
          if (Get-Command py -ErrorAction SilentlyContinue) {
            $exe = py -3.11 -c "import sys; print(sys.executable)"
            if ($LASTEXITCODE -ne 0) { $exe = $null }
          }
          if (-not $exe) { $exe = python -c "import sys; print(sys.executable)" }
          if (-not $exe) { Write-Host "::error::Python introuvable sur le runner"; exit 1 }
          $dir = Split-Path -Parent $exe
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $dir "Scripts") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $exe -c "import sys; assert sys.version_info[:2] == (3, 11), 'Python 3.11 requis'"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Python 3.11 requis"; exit 1 }
      - name: Start PostgreSQL
        run: |
          $ErrorActionPreference = "Continue"
