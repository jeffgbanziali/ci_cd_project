name: CD

# Déploiement automatique sur la VM UNIQUEMENT si la CI est verte sur main.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout (commit validé par la CI)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Nom de l'image (minuscules obligatoires)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Déployer sur la VM (docker compose via SSH)
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$VM_SSH_KEY" > key
          SSH="ssh -i key -o StrictHostKeyChecking=accept-new $VM_USER@$VM_HOST"
          $SSH "mkdir -p ~/pipeline"
          scp -i key -o StrictHostKeyChecking=accept-new docker-compose.prod.yml "$VM_USER@$VM_HOST:~/pipeline/docker-compose.prod.yml"
          $SSH 'bash -s' <<REMOTE
          set -e
          cd ~/pipeline
          printf 'POSTGRES_PASSWORD=%s\nPIPELINE_IMAGE=%s:latest\n' '$POSTGRES_PASSWORD' '$IMAGE' > .env
          echo '$GHCR_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker compose -f docker-compose.prod.yml ps
          REMOTE
          rm -f key
