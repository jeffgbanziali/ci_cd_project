
name: Financial Data Pipeline CD

on:
  workflow_run:
    workflows: ["Financial Data Pipeline CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  # =====================================================
  # JOB 6 - BUILD AND PUBLISH
  # =====================================================
  build-publish:
    name: "6 - Build & Publish Docker Image"

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Définir les métadonnées
        id: meta
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${{ github.event.workflow_run.head_sha || github.sha }}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Image : $IMAGE"
          echo "Tag : $TAG"

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

      - name: Résumé de publication
        run: |
          echo "## Docker Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${{ steps.meta.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: ${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"

  # =====================================================
  # JOB 7 - DEPLOY TO PRODUCTION
  # =====================================================
  deploy:
    name: "7 - Deploy to Production VPS"

    needs: build-publish

    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Vérifier les secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
        run: |
          test -n "$VM_HOST" || { echo "VM_HOST manquant"; exit 1; }
          test -n "$VM_USER" || { echo "VM_USER manquant"; exit 1; }
          test -n "$VM_SSH_KEY" || { echo "VM_SSH_KEY manquant"; exit 1; }
          test -n "$POSTGRES_PASSWORD" || { echo "PROD_POSTGRES_PASSWORD manquant"; exit 1; }

      - name: Préparer SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          install -m 600 /dev/null deploy_key
          printf '%s\n' "$VM_SSH_KEY" > deploy_key
          ssh-keygen -y -f deploy_key > /dev/null

      - name: Ajouter le VPS aux hôtes connus
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Vérifier la connexion SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -i deploy_key "$VM_USER@$VM_HOST" "echo SSH_CONNECTION_OK"

      - name: Préparer le dossier de production
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -i deploy_key "$VM_USER@$VM_HOST" \
            "mkdir -p /home/ubuntu/financial-pipeline/runtime"

      - name: Copier Docker Compose
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          scp -i deploy_key docker-compose.prod.yml \
            "$VM_USER@$VM_HOST:/home/ubuntu/financial-pipeline/runtime/docker-compose.prod.yml"

      - name: Déployer les services
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE: ${{ needs.build-publish.outputs.image }}
          TAG: ${{ needs.build-publish.outputs.tag }}

        run: |
          set -euo pipefail

          POSTGRES_PASSWORD_B64=$(printf '%s' "$POSTGRES_PASSWORD" | base64 -w0)
          GHCR_TOKEN_B64=$(printf '%s' "$GHCR_TOKEN" | base64 -w0)

          ssh -i deploy_key \
            "$VM_USER@$VM_HOST" \
            "POSTGRES_PASSWORD_B64=$POSTGRES_PASSWORD_B64 GHCR_TOKEN_B64=$GHCR_TOKEN_B64 IMAGE=$IMAGE TAG=$TAG GITHUB_ACTOR=$GITHUB_ACTOR bash -s" <<'REMOTE'

          set -euo pipefail

          cd /home/ubuntu/financial-pipeline/runtime

          POSTGRES_PASSWORD=$(printf '%s' "$POSTGRES_PASSWORD_B64" | base64 -d)
          GHCR_TOKEN=$(printf '%s' "$GHCR_TOKEN_B64" | base64 -d)

          umask 077

          printf 'POSTGRES_PASSWORD=%s\nPIPELINE_IMAGE=%s:%s\nSCHEDULE_SECONDS=300\n' \
            "$POSTGRES_PASSWORD" "$IMAGE" "$TAG" > .env

          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

          echo "Téléchargement des images..."

          docker compose -p financial-pipeline \
            -f docker-compose.prod.yml pull

          echo "Démarrage des services..."

          docker compose -p financial-pipeline \
            -f docker-compose.prod.yml up -d

          echo "Vérification des services..."

          docker compose -p financial-pipeline \
            -f docker-compose.prod.yml ps

          REMOTE

      - name: Nettoyer la clé SSH
        if: always()
        run: rm -f deploy_key

      - name: Résumé du déploiement
        if: success()
        run: |
          echo "## Production Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${{ needs.build-publish.outputs.image }}:${{ needs.build-publish.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Scheduler: 300 seconds" >> "$GITHUB_STEP_SUMMARY"
