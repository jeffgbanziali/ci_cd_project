
name: Financial Data Pipeline CD

on:
  workflow_run:
    workflows: ["Financial Data Pipeline CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    name: "3 - Build & Publish Docker Image"
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Définir le nom de l'image
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Image : $IMAGE"

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.event.workflow_run.head_sha || github.sha }}

  deploy:
    name: "4 - Deploy to VPS"
    needs: build-publish
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Vérifier les secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
        run: |
          test -n "$VM_HOST" || (echo "VM_HOST manquant" && exit 1)
          test -n "$VM_USER" || (echo "VM_USER manquant" && exit 1)
          test -n "$VM_SSH_KEY" || (echo "VM_SSH_KEY manquant" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "PROD_POSTGRES_PASSWORD manquant" && exit 1)

      - name: Préparer la connexion SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          install -m 600 /dev/null deploy_key
          printf '%s\n' "$VM_SSH_KEY" > deploy_key
          ssh-keygen -y -f deploy_key > /dev/null

      - name: Copier le fichier Docker Compose
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

          ssh -i deploy_key "$VM_USER@$VM_HOST" \
            "mkdir -p /home/ubuntu/financial-pipeline/runtime"

          scp -i deploy_key docker-compose.prod.yml \
            "$VM_USER@$VM_HOST:/home/ubuntu/financial-pipeline/runtime/docker-compose.prod.yml"

      - name: Déployer sur le VPS
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE: ${{ needs.build-publish.outputs.image }}
        run: |
          set -euo pipefail

          POSTGRES_PASSWORD_B64=$(printf '%s' "$POSTGRES_PASSWORD" | base64 -w0)
          GHCR_TOKEN_B64=$(printf '%s' "$GHCR_TOKEN" | base64 -w0)

          ssh -i deploy_key \
            "$VM_USER@$VM_HOST" \
            "POSTGRES_PASSWORD_B64=$POSTGRES_PASSWORD_B64 GHCR_TOKEN_B64=$GHCR_TOKEN_B64 IMAGE=$IMAGE GITHUB_ACTOR=$GITHUB_ACTOR bash -s" <<'REMOTE'

          set -euo pipefail

          cd /home/ubuntu/financial-pipeline/runtime

          POSTGRES_PASSWORD=$(printf '%s' "$POSTGRES_PASSWORD_B64" | base64 -d)
          GHCR_TOKEN=$(printf '%s' "$GHCR_TOKEN_B64" | base64 -d)

          umask 077
          printf 'POSTGRES_PASSWORD=%s\nPIPELINE_IMAGE=%s\nSCHEDULE_SECONDS=300\n' \
            "$POSTGRES_PASSWORD" "$IMAGE" > .env

          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

          docker compose -p financial-pipeline \
            -f docker-compose.prod.yml pull

          docker compose -p financial-pipeline \
            -f docker-compose.prod.yml up -d

          docker compose -p financial-pipeline \
            -f docker-compose.prod.yml ps

          REMOTE

      - name: Nettoyer la clé SSH
        if: always()
        run: rm -f deploy_key
