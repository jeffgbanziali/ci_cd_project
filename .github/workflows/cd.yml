
name: Financial Data Pipeline CD

on:
  workflow_dispatch:

  workflow_run:
    workflows: ["Financial Data Pipeline CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: financial-pipeline-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  VM_APP_DIR: /home/ubuntu/financial-pipeline/runtime

jobs:

  # --------------------------------------------------
  # 1. VALIDATION DE L'ENVIRONNEMENT
  # --------------------------------------------------
  validate:
    name: Validate Environment
    runs-on: [self-hosted, Windows, X64]

    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check required tools and secrets
        shell: powershell
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          PROD_POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
            throw "Docker n'est pas installé ou accessible."
          }

          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            throw "Python est introuvable."
          }

          $dockerOS = docker info --format '{{.OSType}}'
          if ($dockerOS -ne "linux") {
            throw "Docker Desktop doit utiliser les conteneurs Linux."
          }

          $required = @(
            "VM_HOST",
            "VM_USER",
            "VM_PASSWORD",
            "PROD_POSTGRES_PASSWORD",
            "GHCR_TOKEN"
          )

          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Secret GitHub manquant : $name"
            }
          }

          Write-Host "Environnement validé."

      - name: Generate image metadata
        id: meta
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $image = "ghcr.io/${{ github.repository }}".ToLower()
          $sha = "${{ github.event.workflow_run.head_sha || github.sha }}"
          $tag = $sha.Substring(0, 12)

          "image=$image" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Write-Host "Image : $image"
          Write-Host "Tag : $tag"

      - name: Verify production files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "Dockerfile")) {
            throw "Dockerfile introuvable à la racine du dépôt."
          }

          if (-not (Test-Path "docker-compose.prod.yml")) {
            throw "docker-compose.prod.yml introuvable à la racine du dépôt."
          }

          Write-Host "Fichiers de production présents."


  # --------------------------------------------------
  # 2. BUILD DE L'IMAGE DOCKER
  # --------------------------------------------------
  build-image:
    name: Build Docker Image
    runs-on: [self-hosted, Windows, X64]
    needs: validate

    outputs:
      image: ${{ needs.validate.outputs.image }}
      tag: ${{ needs.validate.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build Docker image
        shell: powershell
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"

          docker build `
            --platform linux/amd64 `
            -t "$env:IMAGE`:$env:TAG" `
            -t "$env:IMAGE`:latest" .

          if ($LASTEXITCODE -ne 0) {
            throw "Échec du build Docker."
          }

          docker images "$env:IMAGE"

      - name: Save Docker image
        shell: powershell
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"

          docker save `
            -o image.tar `
            "$env:IMAGE`:$env:TAG" `
            "$env:IMAGE`:latest"

          if ($LASTEXITCODE -ne 0) {
            throw "Impossible de sauvegarder l'image Docker."
          }

          if (-not (Test-Path "image.tar")) {
            throw "Le fichier image.tar n'a pas été créé."
          }

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: financial-pipeline-image
          path: image.tar
          if-no-files-found: error
          retention-days: 1


  # --------------------------------------------------
  # 3. PUSH DE L'IMAGE VERS GHCR
  # --------------------------------------------------
  push-image:
    name: Push Docker Image to GHCR
    runs-on: [self-hosted, Windows, X64]
    needs: [validate, build-image]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: financial-pipeline-image
          path: .

      - name: Load Docker image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          docker load -i image.tar

          if ($LASTEXITCODE -ne 0) {
            throw "Impossible de charger l'image Docker."
          }

      - name: Login to GitHub Container Registry
        shell: powershell
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          $ErrorActionPreference = "Stop"

          $env:GHCR_TOKEN |
            docker login ghcr.io `
              --username $env:GHCR_USER `
              --password-stdin

          if ($LASTEXITCODE -ne 0) {
            throw "Connexion à GHCR échouée. Vérifie GHCR_TOKEN et les accès du package."
          }

      - name: Push version and latest images
        shell: powershell
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"

          docker push "$env:IMAGE`:$env:TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Échec du push de l'image versionnée."
          }

          docker push "$env:IMAGE`:latest"
          if ($LASTEXITCODE -ne 0) {
            throw "Échec du push de l'image latest."
          }

          Write-Host "Images publiées sur GHCR."

      - name: Logout from GHCR
        if: always()
        shell: powershell
        run: |
          docker logout ghcr.io


  # --------------------------------------------------
  # 4. PRÉPARATION DE LA VM UBUNTU
  # --------------------------------------------------
  prepare-vps:
    name: Prepare Production VPS
    runs-on: [self-hosted, Windows, X64]
    needs: [validate, push-image]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Paramiko
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade paramiko

          if ($LASTEXITCODE -ne 0) {
            throw "Installation de Paramiko échouée."
          }

      - name: Prepare production directory on VPS
        shell: powershell
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          VM_APP_DIR: ${{ env.VM_APP_DIR }}
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import os
          import paramiko
          import sys

          host = os.environ["VM_HOST"]
          user = os.environ["VM_USER"]
          password = os.environ["VM_PASSWORD"]
          app_dir = os.environ["VM_APP_DIR"]

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())

          try:
              client.connect(
                  hostname=host,
                  username=user,
                  password=password,
                  timeout=20,
                  look_for_keys=False,
                  allow_agent=False
              )

              commands = [
                  "mkdir -p " + app_dir,
                  "docker --version",
                  "docker compose version"
              ]

              for command in commands:
                  stdin, stdout, stderr = client.exec_command(command)
                  exit_code = stdout.channel.recv_exit_status()

                  output = stdout.read().decode()
                  error = stderr.read().decode()

                  print(output)

                  if exit_code != 0:
                      print(error, file=sys.stderr)
                      raise RuntimeError("Commande distante échouée : " + command)

              print("VM prête pour le déploiement.")

          finally:
              client.close()
          '@ | Set-Content -Path deploy_prepare.py -Encoding UTF8

          python deploy_prepare.py

          if ($LASTEXITCODE -ne 0) {
            throw "La préparation de la VM a échoué."
          }


  # --------------------------------------------------
  # 5. DÉPLOIEMENT ET VÉRIFICATION
  # --------------------------------------------------
  deploy:
    name: Deploy and Verify Production
    runs-on: [self-hosted, Windows, X64]
    needs: [validate, build-image, push-image, prepare-vps]

    environment: production

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Paramiko
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade paramiko

          if ($LASTEXITCODE -ne 0) {
            throw "Installation de Paramiko échouée."
          }

      - name: Deploy application on Ubuntu VPS
        shell: powershell
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ needs.validate.outputs.image }}
          TAG: ${{ needs.validate.outputs.tag }}
          VM_APP_DIR: ${{ env.VM_APP_DIR }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import os
          import paramiko
          import sys
          import time

          host = os.environ["VM_HOST"]
          user = os.environ["VM_USER"]
          password = os.environ["VM_PASSWORD"]
          token = os.environ["GHCR_TOKEN"]
          ghcr_user = os.environ["GHCR_USER"]
          app_dir = os.environ["VM_APP_DIR"]

          image = os.environ["IMAGE"]
          tag = os.environ["TAG"]
          postgres_password = os.environ["POSTGRES_PASSWORD"]

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())

          def run_command(command, input_data=None):
              stdin, stdout, stderr = client.exec_command(command, timeout=300)

              if input_data is not None:
                  stdin.write(input_data)
                  stdin.flush()
                  stdin.channel.shutdown_write()

              exit_code = stdout.channel.recv_exit_status()
              output = stdout.read().decode(errors="replace")
              error = stderr.read().decode(errors="replace")

              if output:
                  print(output)

              if exit_code != 0:
                  print(error, file=sys.stderr)
                  raise RuntimeError("Commande distante échouée : " + command)

              return output

          try:
              client.connect(
                  hostname=host,
                  username=user,
                  password=password,
                  timeout=20,
                  look_for_keys=False,
                  allow_agent=False
              )

              sftp = client.open_sftp()

              # Transfert du fichier Compose
              local_compose = "docker-compose.prod.yml"
              remote_compose = app_dir + "/docker-compose.prod.yml"

              sftp.put(local_compose, remote_compose)

              # Création du fichier .env
              env_content = (
                  "POSTGRES_PASSWORD=" + postgres_password + "\n"
                  "PIPELINE_IMAGE=" + image + ":" + tag + "\n"
                  "SCHEDULE_SECONDS=300\n"
                  "S3_ACCESS_KEY=minioadmin\n"
                  "S3_SECRET_KEY=minioadminpassword\n"
                  "S3_BUCKET=transactions-bucket\n"
              )

              with sftp.file(app_dir + "/.env", "w") as env_file:
                  env_file.write(env_content)

              run_command("chmod 600 " + app_dir + "/.env")
              sftp.close()

              # Connexion GHCR sur le serveur
              run_command(
              "docker login ghcr.io -u " + repr(ghcr_user) + " --password-stdin",
              token + "\n"
                    )

              # Vérification Compose
              run_command(
                  "cd " + app_dir +
                  " && docker compose -p financial-pipeline "
                  "-f docker-compose.prod.yml config -q"
              )

              # Récupération des images nécessaires
              run_command(
                  "cd " + app_dir +
                  " && docker compose -p financial-pipeline "
                  "-f docker-compose.prod.yml pull"
              )

              # Déploiement
              run_command(
                  "cd " + app_dir +
                  " && docker compose -p financial-pipeline "
                  "-f docker-compose.prod.yml up -d"
              )

              time.sleep(10)

              # Vérification de l'état des conteneurs
              run_command(
                  "cd " + app_dir +
                  " && docker compose -p financial-pipeline "
                  "-f docker-compose.prod.yml ps"
              )

              run_command(
                  "cd " + app_dir +
                  " && docker compose -p financial-pipeline "
                  "-f docker-compose.prod.yml logs --tail=40 scheduler"
              )

              run_command("docker logout ghcr.io")

              print("Déploiement terminé.")

          finally:
              client.close()
          '@ | Set-Content -Path deploy_production.py -Encoding UTF8

          python deploy_production.py

          if ($LASTEXITCODE -ne 0) {
            throw "Le déploiement en production a échoué."
          }

      - name: Deployment summary
        if: success()
        shell: powershell
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          Write-Host "======================================"
          Write-Host "DEPLOIEMENT PRODUCTION REUSSI"
          Write-Host "Image : $env:IMAGE"
          Write-Host "Tag : $env:TAG"
          Write-Host "Serveur : ${{ secrets.VM_HOST }}"
          Write-Host "======================================"
