
name: Financial Data Pipeline CD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: financial-pipeline-production
  cancel-in-progress: false

env:
  IMAGE: financial-pipeline
  VM_APP_DIR: /home/ubuntu/financial-pipeline/runtime

jobs:

  # ==========================================
  # 1. VALIDATION
  # ==========================================
  validate:
    name: Validate Environment
    runs-on: [self-hosted, Windows, X64]

    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check environment and secrets
        shell: powershell
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          PROD_POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($name in @(
            "VM_HOST",
            "VM_USER",
            "VM_PASSWORD",
            "PROD_POSTGRES_PASSWORD"
          )) {
            $value = [Environment]::GetEnvironmentVariable($name)

            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Secret GitHub manquant : $name"
            }
          }

          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
            throw "Docker introuvable."
          }

          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            throw "Python introuvable."
          }

          $dockerOS = docker info --format '{{.OSType}}'

          if ($LASTEXITCODE -ne 0 -or $dockerOS -ne "linux") {
            throw "Docker doit fonctionner en mode Linux."
          }

          Write-Host "Environnement valide."

      - name: Generate image metadata
        id: meta
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $image = "financial-pipeline"
          $sha = "${{ github.sha }}"
          $tag = $sha.Substring(0, 12)

          "image=$image" | Out-File $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append

          Write-Host "Image : $image"
          Write-Host "Tag : $tag"

      - name: Verify production files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "Dockerfile")) {
            throw "Dockerfile introuvable."
          }

          if (-not (Test-Path "docker-compose.prod.yml")) {
            throw "docker-compose.prod.yml introuvable."
          }

          Write-Host "Fichiers de production vérifiés."


  # ==========================================
  # 2. BUILD ET EXPORT DOCKER
  # ==========================================
  build-image:
    name: Build Docker Image
    runs-on: [self-hosted, Windows, X64]
    needs: validate

    outputs:
      image: ${{ needs.validate.outputs.image }}
      tag: ${{ needs.validate.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        shell: powershell
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"

          docker build `
            --platform linux/amd64 `
            -t "$env:IMAGE`:$env:TAG" `
            -t "$env:IMAGE`:latest" .

          if ($LASTEXITCODE -ne 0) {
            throw "Échec du build Docker."
          }

          docker images "$env:IMAGE"

      - name: Export Docker image
        shell: powershell
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"

          docker save `
            -o image.tar `
            "$env:IMAGE`:$env:TAG" `
            "$env:IMAGE`:latest"

          if ($LASTEXITCODE -ne 0) {
            throw "Échec de l'export Docker."
          }

          if (-not (Test-Path "image.tar")) {
            throw "image.tar introuvable."
          }

          Write-Host "Image exportée."

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: financial-pipeline-image
          path: image.tar
          if-no-files-found: error
          retention-days: 1


  # ==========================================
  # 3. TRANSFERT ET DEPLOIEMENT AZURE
  # ==========================================
  deploy:
    name: Deploy to Azure VPS
    runs-on: [self-hosted, Windows, X64]
    needs: [validate, build-image]

    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: financial-pipeline-image
          path: .

      - name: Install Paramiko
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install paramiko

          if ($LASTEXITCODE -ne 0) {
            throw "Installation de Paramiko échouée."
          }

      - name: Transfer image and deploy
        shell: powershell
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          VM_APP_DIR: ${{ env.VM_APP_DIR }}
          IMAGE: ${{ needs.validate.outputs.image }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import os
          import sys
          import paramiko
          import shlex
          import time

          host = os.environ["VM_HOST"]
          user = os.environ["VM_USER"]
          password = os.environ["VM_PASSWORD"]

          app_dir = os.environ["VM_APP_DIR"]
          image = os.environ["IMAGE"]
          tag = os.environ["TAG"]
          postgres_password = os.environ["POSTGRES_PASSWORD"]

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())

          def run_command(command, input_data=None):
              stdin, stdout, stderr = client.exec_command(
                  command,
                  timeout=900
              )

              if input_data is not None:
                  stdin.write(input_data)
                  stdin.flush()
                  stdin.channel.shutdown_write()

              output = stdout.read().decode(errors="replace")
              error = stderr.read().decode(errors="replace")
              exit_code = stdout.channel.recv_exit_status()

              if output:
                  print(output)

              if exit_code != 0:
                  print(error, file=sys.stderr)
                  raise RuntimeError(
                      "Commande distante échouée : " + command
                  )

              return output

          try:
              print("Connexion à la VM Azure...")

              client.connect(
                  hostname=host,
                  username=user,
                  password=password,
                  timeout=30,
                  look_for_keys=False,
                  allow_agent=False
              )

              # Création du répertoire de déploiement
              safe_dir = shlex.quote(app_dir)
              run_command("mkdir -p " + safe_dir)

              # Transfert des fichiers
              sftp = client.open_sftp()

              sftp.put(
                  "image.tar",
                  app_dir + "/image.tar"
              )

              sftp.put(
                  "docker-compose.prod.yml",
                  app_dir + "/docker-compose.prod.yml"
              )

              # Création du fichier .env
              def dotenv_quote(value):
                  return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

              env_content = (
                  "POSTGRES_PASSWORD=" + dotenv_quote(postgres_password) + "\n"
                  "PIPELINE_IMAGE=" + dotenv_quote(image + ":" + tag) + "\n"
                  "SCHEDULE_SECONDS=300\n"
                  "S3_ACCESS_KEY=minioadmin\n"
                  "S3_SECRET_KEY=minioadminpassword\n"
                  "S3_BUCKET=transactions-bucket\n"
              )

              with sftp.file(app_dir + "/.env", "w") as f:
                  f.write(env_content)

              sftp.chmod(app_dir + "/.env", 0o600)
              sftp.close()

              print("Fichiers transférés.")

              # Chargement de l'image Docker sur Azure
              run_command(
                  "cd " + safe_dir +
                  " && docker load -i image.tar"
              )

              print("Image Docker chargée.")

              # Validation de la configuration
              compose = (
                  "docker compose -p financial-pipeline "
                  "-f docker-compose.prod.yml"
              )

              run_command(
                  "cd " + safe_dir +
                  " && " + compose + " config -q"
              )

              # Démarrage des services
              run_command(
                  "cd " + safe_dir +
                  " && " + compose + " up -d --no-build"
              )

              time.sleep(10)

              # Vérification
              run_command(
                  "cd " + safe_dir +
                  " && " + compose + " ps"
              )

              run_command(
                  "cd " + safe_dir +
                  " && " + compose + " logs --tail=40 scheduler"
              )

              print("DEPLOIEMENT TERMINE AVEC SUCCES.")

          finally:
              client.close()
          '@ | Set-Content -Path deploy_production.py -Encoding UTF8

          python deploy_production.py

          if ($LASTEXITCODE -ne 0) {
            throw "Le déploiement Azure a échoué."
          }

      - name: Deployment summary
        if: success()
        shell: powershell
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          Write-Host "======================================"
          Write-Host "DEPLOIEMENT REUSSI"
          Write-Host "Image : $env:IMAGE"
          Write-Host "Tag : $env:TAG"
          Write-Host "Azure : ${{ secrets.VM_HOST }}"
          Write-Host "======================================"
