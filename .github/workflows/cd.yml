
name: Financial Data Pipeline CD

on:
  workflow_run:
    workflows: ["Financial Data Pipeline CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: financial-pipeline-production
  cancel-in-progress: false

jobs:
  build-publish:
    name: "6 - Build & Publish Docker Image"

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Définir les métadonnées
        id: meta
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${{ github.event.workflow_run.head_sha || github.sha }}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Image : $IMAGE"
          echo "Tag : $TAG"

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

      - name: Résumé de publication
        run: |
          echo "## Docker Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${{ steps.meta.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: ${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: "7 - Deploy to Production VPS"

    needs: build-publish

    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Vérifier les secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$VM_HOST" || { echo "VM_HOST manquant"; exit 1; }
          test -n "$VM_USER" || { echo "VM_USER manquant"; exit 1; }
          test -n "$VM_PASSWORD" || { echo "VM_PASSWORD manquant"; exit 1; }
          test -n "$POSTGRES_PASSWORD" || { echo "PROD_POSTGRES_PASSWORD manquant"; exit 1; }

      - name: Installer sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Préparer les hôtes SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Vérifier la connexion SSH
        env:
          SSHPASS: ${{ secrets.VM_PASSWORD }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail

          sshpass -e ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "whoami && docker --version && docker compose version"

      - name: Préparer le dossier de production
        env:
          SSHPASS: ${{ secrets.VM_PASSWORD }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail

          sshpass -e ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "mkdir -p /home/ubuntu/financial-pipeline/runtime"

      - name: Copier Docker Compose
        env:
          SSHPASS: ${{ secrets.VM_PASSWORD }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail

          sshpass -e scp \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            docker-compose.prod.yml \
            "$VM_USER@$VM_HOST:/home/ubuntu/financial-pipeline/runtime/docker-compose.prod.yml"

      - name: Déployer les services
        env:
          SSHPASS: ${{ secrets.VM_PASSWORD }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE: ${{ needs.build-publish.outputs.image }}
          TAG: ${{ needs.build-publish.outputs.tag }}

        shell: bash

        run: |
          set -euo pipefail

          POSTGRES_PASSWORD_B64=$(printf '%s' "$POSTGRES_PASSWORD" | base64 -w0)
          GHCR_TOKEN_B64=$(printf '%s' "$GHCR_TOKEN" | base64 -w0)

          sshpass -e ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "POSTGRES_PASSWORD_B64=$POSTGRES_PASSWORD_B64 GHCR_TOKEN_B64=$GHCR_TOKEN_B64 IMAGE=$IMAGE TAG=$TAG GITHUB_ACTOR=$GITHUB_ACTOR bash -s" <<'REMOTE'

          set -euo pipefail
          umask 077

          DEPLOY_DIR="/home/ubuntu/financial-pipeline/runtime"

          cd "$DEPLOY_DIR"

          POSTGRES_PASSWORD=$(printf '%s' "$POSTGRES_PASSWORD_B64" | base64 -d)
          GHCR_TOKEN=$(printf '%s' "$GHCR_TOKEN_B64" | base64 -d)

          # Création du fichier d'environnement protégé
          printf '%s\n' \
            "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
            "PIPELINE_IMAGE=$IMAGE:$TAG" \
            "SCHEDULE_SECONDS=300" \
            "S3_ACCESS_KEY=minioadmin" \
            "S3_SECRET_KEY=minioadminpassword" \
            "S3_BUCKET=transactions-bucket" \
            > .env

          chmod 600 .env

          # Authentification au registre Docker
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" \
            --password-stdin

          unset GHCR_TOKEN

          # Validation de la configuration
          docker compose -p financial-pipeline \
            -f docker-compose.prod.yml config -q

          # Téléchargement des images
          docker compose -p financial-pipeline \
            -f docker-compose.prod.yml pull scheduler postgres s3

          # Démarrage / mise à jour des services
          docker compose -p financial-pipeline \
            -f docker-compose.prod.yml up -d

          # Déconnexion du registre
          docker logout ghcr.io

          # Vérification
          docker compose -p financial-pipeline \
            -f docker-compose.prod.yml ps

          echo "Déploiement terminé."

          REMOTE

      - name: Résumé du déploiement
        if: success()
        run: |
          echo "## Production Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${{ needs.build-publish.outputs.image }}:${{ needs.build-publish.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Scheduler: 300 seconds" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment directory: /home/ubuntu/financial-pipeline/runtime" >> "$GITHUB_STEP_SUMMARY"
