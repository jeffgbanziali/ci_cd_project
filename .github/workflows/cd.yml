
name: Financial Data Pipeline CD

on:
  workflow_run:
    workflows: ["Financial Data Pipeline CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: financial-pipeline-production
  cancel-in-progress: false

jobs:

  # =====================================================
  # JOB 1 - VALIDATION
  # =====================================================
  validate:
    name: "1 - Validate Environment"

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}

    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Vérifier Python
        shell: pwsh
        run: |
          py -3.11 --version
          if ($LASTEXITCODE -ne 0) {
            throw "Python 3.11 est obligatoire"
          }

      - name: Vérifier Docker
        shell: pwsh
        run: |
          docker --version
          if ($LASTEXITCODE -ne 0) {
            throw "Docker indisponible"
          }

          docker compose version
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Compose indisponible"
          }

      - name: Vérifier les fichiers
        shell: pwsh
        run: |
          if (!(Test-Path "Dockerfile")) {
            throw "Dockerfile introuvable à la racine"
          }

          if (!(Test-Path "docker-compose.prod.yml")) {
            throw "docker-compose.prod.yml introuvable"
          }

      - name: Vérifier les secrets
        shell: pwsh
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
        run: |
          if (!$env:VM_HOST) { throw "VM_HOST manquant" }
          if (!$env:VM_USER) { throw "VM_USER manquant" }
          if (!$env:VM_PASSWORD) { throw "VM_PASSWORD manquant" }
          if (!$env:POSTGRES_PASSWORD) {
            throw "PROD_POSTGRES_PASSWORD manquant"
          }

          Write-Host "Tous les contrôles sont validés."

  # =====================================================
  # JOB 2 - BUILD AND PUBLISH
  # =====================================================
  build-publish:
    name: "2 - Build & Publish Docker Image"

    needs: validate

    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40

    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Définir les métadonnées
        id: meta
        shell: pwsh
        run: |
          $image = "ghcr.io/${{ github.repository }}".ToLowerInvariant()
          $tag = "${{ github.event.workflow_run.head_sha || github.sha }}"

          "image=$image" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

          Write-Host "Image : $image"
          Write-Host "Tag : $tag"

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

      - name: Résumé de publication
        shell: pwsh
        run: |
          "## Docker Image Published" >> $env:GITHUB_STEP_SUMMARY
          "Image: ${{ steps.meta.outputs.image }}" >> $env:GITHUB_STEP_SUMMARY
          "Tag: ${{ steps.meta.outputs.tag }}" >> $env:GITHUB_STEP_SUMMARY

  # =====================================================
  # JOB 3 - PREPARE VPS
  # =====================================================
  prepare-vps:
    name: "3 - Prepare Production VPS"

    needs: build-publish

    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    environment: production

    steps:
      - name: Installer Paramiko
        shell: pwsh
        run: |
          py -3.11 -m pip install paramiko
          if ($LASTEXITCODE -ne 0) {
            throw "Installation de Paramiko impossible"
          }

      - name: Vérifier la connexion SSH et Docker
        shell: pwsh
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
        run: |
          @'
          import os
          import sys
          import paramiko

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())

          try:
              client.connect(
                  hostname=os.environ["VM_HOST"],
                  username=os.environ["VM_USER"],
                  password=os.environ["VM_PASSWORD"],
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=20,
                  auth_timeout=20
              )

              command = "whoami && docker --version && docker compose version"
              stdin, stdout, stderr = client.exec_command(command)

              output = stdout.read().decode()
              error = stderr.read().decode()
              status = stdout.channel.recv_exit_status()

              print(output)
              if error:
                  print(error, file=sys.stderr)

              if status != 0:
                  raise RuntimeError("Vérification du VPS échouée")

              print("SSH_CONNECTION_OK")

          finally:
              client.close()
          '@ | py -3.11 -

          if ($LASTEXITCODE -ne 0) {
            throw "Connexion ou vérification VPS échouée"
          }

      - name: Résumé de préparation
        shell: pwsh
        run: |
          "## VPS Ready" >> $env:GITHUB_STEP_SUMMARY
          "SSH authentication successful." >> $env:GITHUB_STEP_SUMMARY
          "Docker and Docker Compose available." >> $env:GITHUB_STEP_SUMMARY

  # =====================================================
  # JOB 4 - DEPLOY AND VERIFY
  # =====================================================
  deploy:
    name: "4 - Deploy & Verify Production"

    needs:
      - build-publish
      - prepare-vps

    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Installer Paramiko
        shell: pwsh
        run: |
          py -3.11 -m pip install paramiko
          if ($LASTEXITCODE -ne 0) {
            throw "Installation de Paramiko impossible"
          }

      - name: Déployer sur le VPS
        shell: pwsh
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE: ${{ needs.build-publish.outputs.image }}
          TAG: ${{ needs.build-publish.outputs.tag }}
        run: |
          @'
          import os
          import sys
          import paramiko

          def dotenv_quote(value):
              if "\n" in value or "\r" in value:
                  raise ValueError("Valeur .env invalide")
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          host = os.environ["VM_HOST"]
          user = os.environ["VM_USER"]
          password = os.environ["VM_PASSWORD"]
          postgres_password = os.environ["POSTGRES_PASSWORD"]
          ghcr_token = os.environ["GHCR_TOKEN"]
          actor = os.environ["GITHUB_ACTOR"]
          image = os.environ["IMAGE"]
          tag = os.environ["TAG"]

          deploy_dir = "/home/ubuntu/financial-pipeline/runtime"

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())

          def remote(command, input_text=None):
              stdin, stdout, stderr = client.exec_command(command)

              if input_text is not None:
                  stdin.write(input_text)
                  stdin.flush()

              stdin.channel.shutdown_write()

              output = stdout.read().decode()
              error = stderr.read().decode()
              status = stdout.channel.recv_exit_status()

              if output:
                  print(output)

              if error:
                  print(error, file=sys.stderr)

              if status != 0:
                  raise RuntimeError(
                      f"Commande distante échouée (code {status})"
                  )

          try:
              print("Connexion au VPS...")

              client.connect(
                  hostname=host,
                  username=user,
                  password=password,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=20,
                  auth_timeout=20
              )

              print("Préparation du dossier...")
              remote(f"mkdir -p {deploy_dir}")

              sftp = client.open_sftp()

              print("Transfert de Docker Compose...")
              sftp.put(
                  "docker-compose.prod.yml",
                  f"{deploy_dir}/docker-compose.prod.yml"
              )

              env_content = "\n".join([
                  f"POSTGRES_PASSWORD={dotenv_quote(postgres_password)}",
                  f"PIPELINE_IMAGE={dotenv_quote(image + ':' + tag)}",
                  "SCHEDULE_SECONDS=300",
                  "S3_ACCESS_KEY=minioadmin",
                  "S3_SECRET_KEY=minioadminpassword",
                  "S3_BUCKET=transactions-bucket",
                  ""
              ])

              with sftp.file(f"{deploy_dir}/.env", "w") as env_file:
                  env_file.write(env_content)

              sftp.chmod(f"{deploy_dir}/.env", 0o600)
              sftp.close()

              print("Connexion à GHCR...")
              import shlex

              login_command = (
                  "docker login ghcr.io -u "
                  + shlex.quote(actor)
                  + " --password-stdin"
              )
              remote(login_command, ghcr_token + "\n")

              script = f"""#!/usr/bin/env bash
          set -euo pipefail

          cd {shlex.quote(deploy_dir)}

          echo "Validation Docker Compose..."
          docker compose -p financial-pipeline -f docker-compose.prod.yml config -q

          echo "Téléchargement des images..."
          docker compose -p financial-pipeline -f docker-compose.prod.yml pull scheduler postgres s3

          echo "Démarrage des services..."
          docker compose -p financial-pipeline -f docker-compose.prod.yml up -d

          echo "Déconnexion GHCR..."
          docker logout ghcr.io || true

          echo "État des services..."
          docker compose -p financial-pipeline -f docker-compose.prod.yml ps

          echo "Derniers logs du scheduler..."
          docker compose -p financial-pipeline -f docker-compose.prod.yml logs --tail=40 scheduler

          echo "DEPLOYMENT_SUCCESS"
          """

              print("Déploiement en cours...")
              remote("bash -s", script)

              print("Déploiement terminé avec succès.")

          finally:
              client.close()
          '@ | py -3.11 -

          if ($LASTEXITCODE -ne 0) {
            throw "Le déploiement a échoué"
          }

      - name: Résumé final
        if: success()
        shell: pwsh
        run: |
          "## Production Deployment Successful" >> $env:GITHUB_STEP_SUMMARY
          "Image: ${{ needs.build-publish.outputs.image }}:${{ needs.build-publish.outputs.tag }}" >> $env:GITHUB_STEP_SUMMARY
          "Deployment: /home/ubuntu/financial-pipeline/runtime" >> $env:GITHUB_STEP_SUMMARY
          "Scheduler interval: 300 seconds" >> $env:GITHUB_STEP_SUMMARY
