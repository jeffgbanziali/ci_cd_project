
name: Financial Data Pipeline CD

on:
  workflow_dispatch:

  workflow_run:
    workflows: ["Financial Data Pipeline CI"]
    types:
      - completed
    branches:
      - main
permissions:
  contents: read

concurrency:
  group: financial-pipeline-production
  cancel-in-progress: false

env:
  IMAGE: financial-pipeline
  VM_APP_DIR: /home/ubuntu/financial-pipeline/runtime

jobs:

  # ==========================================
  # 1. VALIDATION DE L'ENVIRONNEMENT
  # ==========================================
  validate:
    name: Validate Environment
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64]

    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Check environment and secrets
        shell: powershell
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          PROD_POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($name in @(
            "VM_HOST",
            "VM_USER",
            "VM_PASSWORD",
            "PROD_POSTGRES_PASSWORD"
          )) {
            $value = [Environment]::GetEnvironmentVariable($name)

            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Secret GitHub manquant : $name"
            }
          }

          foreach ($tool in @("docker", "python", "terraform")) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "$tool est introuvable sur le runner."
            }
          }

          $dockerOS = docker info --format '{{.OSType}}'

          if ($LASTEXITCODE -ne 0 -or $dockerOS -ne "linux") {
            throw "Docker doit fonctionner en mode Linux."
          }

          terraform version
          Write-Host "Environnement valide."

      - name: Generate image metadata
        id: meta
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $image = "financial-pipeline"
          $sha = "${{ github.sha }}"
          $tag = $sha.Substring(0, 12)

          "image=$image" | Out-File $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append

          Write-Host "Image : $image"
          Write-Host "Tag : $tag"

      - name: Verify production files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $files = @(
            "Dockerfile",
            "docker-compose.prod.yml",
            "terraform/main.tf",
            "terraform/variables.tf"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Fichier introuvable : $file"
            }
          }

          Write-Host "Fichiers de production vérifiés."

  # ==========================================
  # 2. BUILD + TRANSFERT + DEPLOIEMENT
  # ==========================================
  deploy:
    name: Build and Deploy to Azure
    runs-on: [self-hosted, Windows, X64]
    needs: validate

    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # --------------------------------------
      # BUILD DOCKER
      # --------------------------------------
      - name: Build Docker image
        shell: powershell
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"

          docker build `
            --platform linux/amd64 `
            -t "$env:IMAGE`:$env:TAG" `
            -t "$env:IMAGE`:latest" .

          if ($LASTEXITCODE -ne 0) {
            throw "Échec du build Docker."
          }

          docker images "$env:IMAGE"

      # --------------------------------------
      # EXPORT IMAGE
      # --------------------------------------
      - name: Export Docker image
        shell: powershell
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"

          docker save `
            -o image.tar `
            "$env:IMAGE`:$env:TAG" `
            "$env:IMAGE`:latest"

          if ($LASTEXITCODE -ne 0) {
            throw "Échec de l'export Docker."
          }

          if (-not (Test-Path "image.tar")) {
            throw "image.tar introuvable."
          }

          Write-Host "Image Docker exportée."

      # --------------------------------------
      # INSTALLATION PARAMIKO
      # --------------------------------------
      - name: Install Paramiko
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install paramiko

          if ($LASTEXITCODE -ne 0) {
            throw "Installation de Paramiko échouée."
          }

      # --------------------------------------
      # TRANSFERT VERS LA VM
      # --------------------------------------
      - name: Transfer image and configuration
        shell: powershell
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          VM_APP_DIR: ${{ env.VM_APP_DIR }}
          IMAGE: ${{ needs.validate.outputs.image }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"

          @'
          import os
          import sys
          import shlex
          import paramiko

          host = os.environ["VM_HOST"]
          user = os.environ["VM_USER"]
          password = os.environ["VM_PASSWORD"]

          app_dir = os.environ["VM_APP_DIR"]
          image = os.environ["IMAGE"]
          tag = os.environ["TAG"]
          postgres_password = os.environ["POSTGRES_PASSWORD"]

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())

          def run_command(command):
              stdin, stdout, stderr = client.exec_command(
                  command,
                  timeout=900
              )

              exit_code = stdout.channel.recv_exit_status()

              output = stdout.read().decode(errors="replace")
              error = stderr.read().decode(errors="replace")

              if output:
                  print(output)

              if exit_code != 0:
                  print(error, file=sys.stderr)
                  raise RuntimeError(
                      "Commande distante échouée : " + command
                  )

              return output

          def dotenv_quote(value):
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          try:
              print("Connexion à la VM...")

              client.connect(
                  hostname=host,
                  username=user,
                  password=password,
                  timeout=30,
                  look_for_keys=False,
                  allow_agent=False
              )

              safe_dir = shlex.quote(app_dir)

              # 1. Préparer le répertoire
              run_command("mkdir -p " + safe_dir)

              # 2. Transférer les fichiers
              print("Transfert de l'image Docker et du Compose...")

              sftp = client.open_sftp()

              sftp.put(
                  "image.tar",
                  app_dir + "/image.tar"
              )

              sftp.put(
                  "docker-compose.prod.yml",
                  app_dir + "/docker-compose.prod.yml"
              )

              # 3. Générer le fichier .env
              env_content = (
                  "POSTGRES_PASSWORD=" + dotenv_quote(postgres_password) + "\n"
                  "PIPELINE_IMAGE=" + dotenv_quote(image + ":" + tag) + "\n"
                  "SCHEDULE_SECONDS=300\n"
                  "S3_ACCESS_KEY=minioadmin\n"
                  "S3_SECRET_KEY=minioadminpassword\n"
                  "S3_BUCKET=transactions-bucket\n"
              )

              with sftp.file(app_dir + "/.env", "w") as env_file:
                  env_file.write(env_content)

              sftp.chmod(app_dir + "/.env", 0o600)
              sftp.close()

              print("Transfert terminé.")

              # 4. Charger l'image sur la VM
              print("Chargement de l'image Docker...")

              run_command(
                  "cd " + safe_dir +
                  " && docker load -i image.tar"
              )

              print("Image Docker chargée avec succès.")

          finally:
              client.close()
          '@ | Set-Content -Path deploy_production.py -Encoding UTF8

          python deploy_production.py

          if ($LASTEXITCODE -ne 0) {
            throw "Le transfert vers la VM a échoué."
          }

      # --------------------------------------
      # TERRAFORM : DEPLOIEMENT PRODUCTION
      # --------------------------------------
      - name: Terraform init
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          terraform -chdir=terraform init -input=false

          if ($LASTEXITCODE -ne 0) {
            throw "Terraform init a échoué."
          }

      - name: Terraform apply
        shell: powershell
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASSWORD: ${{ secrets.VM_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          terraform -chdir=terraform apply `
            -auto-approve `
            -input=false `
            -var="ssh_host=$env:VM_HOST" `
            -var="ssh_user=$env:VM_USER" `
            -var="ssh_password=$env:VM_PASSWORD" `
            -var="deploy_revision=${{ github.sha }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Terraform apply a échoué."
          }

          Write-Host "Déploiement Terraform terminé."

      # --------------------------------------
      # RESUME DU DEPLOIEMENT
      # --------------------------------------
      - name: Deployment summary
        if: success()
        shell: powershell
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          Write-Host "======================================"
          Write-Host "DEPLOIEMENT REUSSI"
          Write-Host "Image : $env:IMAGE"
          Write-Host "Tag : $env:TAG"
          Write-Host "Serveur : ${{ secrets.VM_HOST }}"
          Write-Host "Terraform : applique avec succes"
          Write-Host "======================================"
